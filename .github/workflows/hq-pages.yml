name: HQ Office Pages

on:
  push:
    branches: [main]
    paths: ['hq/**', '.github/workflows/hq-pages.yml']
  pull_request:
    paths: ['hq/**', '.github/workflows/hq-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hq-pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify HQ v14 photo interface
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          for file in manifest.webmanifest sw.js icon-192.png icon-512.png; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
          python hq/build.py _site
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const html=fs.readFileSync('_site/hq/index.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          assert.equal(scripts.length,1);
          new vm.Script(scripts[0][1]);
          assert.match(html,/id="office"/);
          assert.match(html,/id="meeting"/);
          assert.match(html,/office-v13\.webp\?v=14/);
          assert.match(html,/meeting-v13\.webp\?v=14/);
          assert.match(html,/manifest\.webmanifest\?v=14/);
          for (const id of ['owner','codex','fable','astra','chief']) assert.match(html,new RegExp(`data-person="${id}"`));
          const m=JSON.parse(fs.readFileSync('_site/hq/manifest.webmanifest','utf8'));
          assert.equal(m.start_url,'./?v=14');
          assert.ok(m.icons.some(x=>x.sizes==='192x192'));
          assert.ok(m.icons.some(x=>x.sizes==='512x512'));
          for(const f of ['_site/hq/office-v13.webp','_site/hq/meeting-v13.webp']) assert.ok(fs.statSync(f).size>5000,f);
          console.log('PASS HQ v14 cache-busted photo UI');
          NODE
          git diff --check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
