name: HQ Office Pages

on:
  push:
    branches: [main]
    paths: ['hq/**', '.github/workflows/hq-pages.yml']
  pull_request:
    paths: ['hq/**', '.github/workflows/hq-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hq-pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify HQ v23 standalone PWA
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          for file in manifest.webmanifest sw.js icon-192.png icon-512.png; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
          python hq/build.py _site
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const html=fs.readFileSync('_site/hq/index.html','utf8');
          const swipe=fs.readFileSync('_site/hq/swipe-v22.js','utf8');
          const sw=fs.readFileSync('_site/hq/sw.js','utf8');
          for (const id of ['ops','review','logs','system','overlay','closeBtn']) assert.match(html,new RegExp(`id="${id}"`));
          for (const tab of ['ops','review','logs','system']) assert.match(html,new RegExp(`data-tab="${tab}"`));
          assert.match(html,/swipe-v22\.js\?v=23/);
          assert.match(swipe,/touchstart/); assert.match(swipe,/touchend/); assert.match(swipe,/serviceWorker\.register\('\.\/sw\.js'/);
          assert.match(sw,/lastwall-hq-v23/);
          assert.match(html,/manifest\.webmanifest\?v=23/);
          const m=JSON.parse(fs.readFileSync('_site/hq/manifest.webmanifest','utf8'));
          assert.equal(m.id,'./');
          assert.equal(m.start_url,'./?v=23');
          assert.equal(m.scope,'./');
          assert.equal(m.display,'standalone');
          assert.ok(m.icons.some(x=>x.purpose==='any' && x.sizes==='192x192'));
          assert.ok(m.icons.some(x=>x.purpose==='any' && x.sizes==='512x512'));
          assert.ok(m.icons.some(x=>x.purpose==='maskable' && x.sizes==='512x512'));
          console.log('PASS HQ v23 standalone PWA');
          NODE
          git diff --check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
