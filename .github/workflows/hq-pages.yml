name: HQ Office Pages

on:
  push:
    branches: [main]
    paths: ['hq/**', '.github/workflows/hq-pages.yml']
  pull_request:
    paths: ['hq/**', '.github/workflows/hq-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hq-pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify HQ v20 future console
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          for file in manifest.webmanifest sw.js icon-192.png icon-512.png; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
          python hq/build.py _site
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const html=fs.readFileSync('_site/hq/index.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          assert.equal(scripts.length,1);
          new vm.Script(scripts[0][1]);
          for (const id of ['office','meeting','logs','more']) assert.match(html,new RegExp(`id="${id}"`));
          for (const tab of ['office','meeting','logs','more']) assert.match(html,new RegExp(`data-tab="${tab}"`));
          assert.match(html,/Codex #243 · CLAIMED/);
          assert.match(html,/heartbeat/);
          assert.doesNotMatch(html,/data-person="owner"/);
          assert.doesNotMatch(html,/<img/);
          assert.match(html,/manifest\.webmanifest\?v=20/);
          const m=JSON.parse(fs.readFileSync('_site/hq/manifest.webmanifest','utf8'));
          assert.equal(m.start_url,'./?v=20');
          console.log('PASS HQ v20 future console');
          NODE
          git diff --check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
