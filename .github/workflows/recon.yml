name: recon-backfill
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python recon.py
      - name: persist
        continue-on-error: true
        run: |
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -la recon_result.json odte_log.json
          git add -A
          git commit -m "recon $(date -u +%F_%H%M)"
          echo "commit rc=$?"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && { echo "push OK"; break; }
            git rebase --abort 2>/dev/null
            echo "retry $i"; sleep 5
          done
          exit 0
