name: recon-backfill
# 앱이 제때 판정하지 못한 날을 스펙대로 재구성해 원장에 넣고 화면까지 배포한다 (옵션가는 모델가, '·소급' 표시).
on:
  schedule:
    - cron: "40 21,23 * * 1-5"     # 장 마감 뒤 (UTC). 밀려 도착해도 무방 — 멱등
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: odte-recon                # odte 연쇄가 장중 내내 odte 그룹을 잡고 있어 같은 그룹이면 recon이 영영 못 돈다.
  cancel-in-progress: false        # 대신 아래 가드로 장중(원장을 odte가 쓰는 시간)에는 실행하지 않는다.
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ok: ${{ steps.guard.outputs.ok }}
    steps:
      - id: guard
        name: guard (장중에는 원장을 건드리지 않는다)
        run: |
          D=$(TZ=America/New_York date +%u); T=$((10#$(TZ=America/New_York date +%H%M)))
          if [ "$D" -le 5 ] && [ "$T" -ge 915 ] && [ "$T" -lt 1610 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::장중(09:15~16:10 ET)이라 recon을 건너뜀"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - if: steps.guard.outputs.ok == 'true'
        run: pip install yfinance pandas
      - if: steps.guard.outputs.ok == 'true'
        run: python recon.py
      - name: persist
        if: steps.guard.outputs.ok == 'true'
        continue-on-error: true
        run: |
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -la recon_result.json odte_log.json
          git add odte_log.json recon_result.json index.html manifest.webmanifest sw.js icon-192.png icon-512.png 2>/dev/null || git add odte_log.json recon_result.json index.html
          git commit -m "recon $(date -u +%F_%H%M)"
          echo "commit rc=$?"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs && git push && { echo "push OK"; break; }
            git rebase --abort 2>/dev/null
            echo "retry $i"; sleep 5
          done
          exit 0
      - name: pages 발사 (화면 배포는 pages.yml)
        if: steps.guard.outputs.ok == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow pages.yml --status waiting --json databaseId -q '.[].databaseId' 2>/dev/null); do
            echo "대기에 걸린 배포 $id 취소"; gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
          done
          gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main || echo "::warning::pages 발사 실패"
