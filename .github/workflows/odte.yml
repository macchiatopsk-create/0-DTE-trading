name: odte-mock
on:
  schedule:
    # 장중 15분 간격 (UTC). 미 동부 09:45~16:00 ET 대응 (서머타임 기준)
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: odte
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python odte.py
      - name: persist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odte_log.json index.html
          git commit -m "odte $(date -u +%F_%H%M)" || echo "변동 없음"
          git pull --rebase -X theirs || (git rebase --abort 2>/dev/null; true)
          git push || echo "푸시 스킵"
      - name: pages
        run: |
          mkdir -p _site && cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
