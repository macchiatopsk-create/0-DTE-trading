name: odte-mock
on:
  schedule:
    # 장중 백업 틱 (UTC). GitHub 예약 실행은 몇 시간씩 밀려 도착하므로 이것만 믿으면 안 된다
    # (2026-08-27~10-01: 첫 실행이 매일 12:49~14:47 ET에 도착 → 09:45 판정을 5주간 한 번도 못 함).
    - cron: "*/5 13-21 * * 1-5"
    # 기상 티켓: 새벽부터 매시 1장. 6~7시간 밀려도 개장 전에 도착한다.
    # 도착하면 아래 '대기' 모드가 09:20 ET까지 연쇄로 버티다가 장중 모드로 넘어간다.
    - cron: "17 2-12 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "장외에도 파이썬 실행 (수동 점검용)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: odte
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        name: mode (뉴욕 시각 기준 — 서머타임 자동)
        run: |
          D=$(TZ=America/New_York date +%u); T=$((10#$(TZ=America/New_York date +%H%M)))
          if   [ "$D" -le 5 ] && [ "$T" -lt 920 ];  then M=wait      # 개장 전: 파이썬 안 돌리고 연쇄만 유지
          elif [ "$D" -le 5 ] && [ "$T" -lt 1605 ]; then M=live      # 장중
          else M=off; fi                                             # 장 마감 뒤·주말: 아무것도 안 함 (원장은 장중 실행과 recon만 쓴다)
          if [ "${{ inputs.force }}" = "true" ]; then M=live; fi      # 수동 점검
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "NY $(TZ=America/New_York date '+%a %H:%M:%S') → $M"
      - uses: actions/checkout@v4
        if: steps.mode.outputs.mode == 'live'
        with:
          ref: main      # 대기열에 있다가 늦게 시작한 실행이 '발사 시점의 옛 커밋'으로 돌아 최신 원장을 덮어쓰지 않게 (2026-10-07)
      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode == 'live'
        with:
          python-version: "3.12"
      - if: steps.mode.outputs.mode == 'live'
        run: pip install yfinance pandas
      - name: align (5분 경계 +15초에 맞춰 실행 — 09:45 판정을 09:45에)
        if: steps.mode.outputs.mode == 'live'
        run: |
          now=$(date +%s); nxt=$(( (now/300+1)*300 + 15 )); d=$((nxt-now))
          if [ "$d" -le 150 ]; then echo "정렬 대기 ${d}s"; sleep "$d"; else echo "정렬 생략 (다음 경계까지 ${d}s)"; fi
      - if: steps.mode.outputs.mode == 'live'
        run: python odte.py
      - name: persist
        if: steps.mode.outputs.mode == 'live'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odte_log.json index.html manifest.webmanifest sw.js icon-192.png icon-512.png 2>/dev/null || git add odte_log.json index.html
          git commit -m "odte $(date -u +%F_%H%M)" || echo "변동 없음"
          git pull --rebase -X theirs || (git rebase --abort 2>/dev/null; true)
          git push || echo "푸시 스킵"
      # 화면 배포는 별도 워크플로(pages.yml)로 뺐다. 2026-10-06 11:05 ET에 이 워크플로 안의 deploy 잡이
      # github-pages 환경 대기에 걸려 odte 그룹을 26시간 붙잡았고, 그동안 앱이 통째로 멈췄다.
      - name: pages 발사 (실패해도 앱 실행에는 영향 없음)
        if: steps.mode.outputs.mode == 'live'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow pages.yml --status waiting --json databaseId -q '.[].databaseId' 2>/dev/null); do
            echo "대기에 걸린 배포 $id 취소"; gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
          done
          gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main || echo "::warning::pages 발사 실패"

  # 연쇄: 다음 실행을 스스로 예약한다.
  chain:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: self-chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(TZ=America/New_York date +%u); T=$((10#$(TZ=America/New_York date +%H%M)))
          now=$(date +%s)
          if [ "$D" -le 5 ] && [ "$T" -lt 920 ]; then
            # 개장 전 대기: 09:20 ET까지 남은 시간(최대 50분)만큼 자고 다시 발사
            tgt=$(TZ=America/New_York date -d "today 09:20" +%s); s=$((tgt-now))
            [ "$s" -gt 3000 ] && s=3000; [ "$s" -lt 5 ] && s=5
          elif [ "$D" -le 5 ] && [ "$T" -lt 1600 ]; then
            # 장중: 다음 5분 경계 75초 전에 발사 → 새 실행이 준비(체크아웃·설치)를 끝내고 경계 +15초에 판정
            # (이미 75초 안쪽이면 기다리지 않고 바로 발사 — 경계를 건너뛰지 않는다)
            nxt=$(( (now/300+1)*300 )); s=$((nxt-now-75)); [ "$s" -lt 0 ] && s=0
          else
            echo "장외 — 연쇄 종료"; exit 0
          fi
          echo "대기 ${s}s 후 재발사"; sleep "$s"
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/odte.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$code" = "204" ]; then echo "self-chain 재발사 OK"; exit 0; fi
            echo "재발사 실패($code) — 재시도 $i"; sleep 8
          done
          echo "::warning::self-chain 재발사 실패 — 다음 예약 틱이 살릴 때까지 공백"

