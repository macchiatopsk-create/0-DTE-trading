<style>
:root{color-scheme:dark;--bg:#17252c;--text:#f1eddf;--muted:#a4b5b3;--gold:#e3c48c}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}body{overflow:hidden}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #f1dca6;outline-offset:3px}[hidden]{display:none!important}.app{height:100vh;height:100dvh;display:grid;grid-template-rows:68px minmax(0,1fr) 62px;max-width:1500px;margin:auto}header{padding:8px 17px;display:flex;align-items:center;justify-content:space-between;background:#111f26;border-bottom:1px solid #ffffff0b;gap:12px}header b{font-size:14px;letter-spacing:1.2px}header small{display:block;font-size:10px;color:var(--muted);margin-top:3px}.logo{color:var(--gold);margin-right:9px;font-size:25px}#sourceButton{border:0;background:none;text-align:right;font-size:10px;color:#c8d4cb;max-width:180px;min-height:44px}.scene{position:relative;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 40%,#324b54,#1b2c35);isolation:isolate}.scene-heading{position:absolute;top:16px;left:18px;z-index:2;pointer-events:none}.scene-heading small{font-size:8px;letter-spacing:2px;color:#b2c3bf}.scene-heading h1{font-size:18px;margin:5px 0;font-weight:550}.scene-heading p{font-size:10px;color:#c6d1c8;margin:6px 0}#office{width:100%;height:100%;display:block;touch-action:none;user-select:none}#camera{transform-origin:300px 440px}.seat{cursor:pointer;outline:none}.seat .halo{fill:none;stroke:transparent;stroke-width:4}.seat:hover .halo,.seat:focus .halo,.seat.selected .halo{stroke:#ffe1a0}.person{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.seat:nth-child(2n) .person{animation-delay:-1.7s}.name{font-size:19px;font-weight:650;fill:#fff5dc;text-anchor:middle;paint-order:stroke;stroke:#24322ad0;stroke-width:4}.subname{font-size:12px;fill:#eadbc0;text-anchor:middle;paint-order:stroke;stroke:#24322a;stroke-width:3}.controls{position:absolute;right:12px;top:18px;display:flex;flex-direction:column;gap:6px}.controls button{width:44px;height:44px;border-radius:14px;border:1px solid #ffffff16;background:#11232ae8;font-size:20px}.floor-caption{position:absolute;bottom:13px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:10px;color:#d0d9cd;pointer-events:none}.floor-caption span:first-child{border:1px solid #ffffff15;background:#12252bc0;padding:7px 12px;border-radius:20px}.floor-caption span:last-child{padding:7px 0}nav{display:flex;justify-content:space-evenly;align-items:stretch;background:#111f26;padding:3px 8px max(3px,env(safe-area-inset-bottom));border-top:1px solid #ffffff0a}nav button{min-height:50px;min-width:66px;background:none;border:0;border-radius:13px;color:#98aaa9;font-size:10px}nav button i{display:block;font-style:normal;font-size:21px;line-height:24px}nav button.active{color:var(--gold);background:#d4b27b0b}.scrim{position:fixed;inset:0;background:#06101980;backdrop-filter:blur(2px);z-index:9}.sheet{position:fixed;bottom:0;left:0;right:0;max-height:78vh;max-height:78dvh;background:#14252bf9;border:1px solid #60736d6b;border-bottom:0;border-radius:26px 26px 0 0;z-index:10;box-shadow:0 -12px 60px #0006;padding-bottom:env(safe-area-inset-bottom)}.handle{width:32px;height:4px;margin:10px auto;border-radius:9px;background:#62716a}#close{position:absolute;right:13px;top:17px;border:0;background:#ffffff0a;border-radius:14px;width:44px;height:44px;font-size:23px}#detail{max-height:calc(78dvh - 30px);overflow:auto;overscroll-behavior:contain;padding:8px 23px 28px}.eyebrow{font-size:9px;letter-spacing:2px;color:var(--gold)}h2{font-size:25px;margin:8px 48px 3px 0}.muted{font-size:12px;line-height:1.75;color:var(--muted)}.status{font-size:11px;padding:6px 10px;border:1px solid #aebacc30;display:inline-block;border-radius:30px;margin:9px 0}.current{padding:13px 0;border-top:1px solid #ffffff14;border-bottom:1px solid #ffffff14;margin:9px 0}.current b{display:block;font-size:16px;line-height:1.6;margin-top:5px}.timer{font-size:34px;letter-spacing:1px;font-variant-numeric:tabular-nums;margin-top:9px;color:#efdcbb}dl{display:grid;grid-template-columns:98px 1fr;gap:11px 8px;font-size:12px;line-height:1.5}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.row{display:block;text-decoration:none;text-align:left;color:#eceddd;border:1px solid #ffffff17;background:#ffffff04;padding:13px;border-radius:12px;margin:8px 0;width:100%;min-height:44px;font-size:13px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.row:hover{border-color:#c6b07b}h3{font-size:13px;margin-top:24px}.notice{border-left:2px solid #cbb785;padding:0 0 0 12px;color:#c3ccc0;font-size:11px;line-height:1.8}.toast{position:fixed;z-index:20;bottom:78px;left:50%;transform:translateX(-50%);max-width:90vw;width:max-content;background:#07161deb;border:1px solid #74846a;border-radius:12px;padding:12px 16px;font-size:12px;box-shadow:0 6px 30px #0006}.night .scene{filter:brightness(.8)}@keyframes breathe{50%{transform:translateY(-2px)}}@media(prefers-reduced-motion:reduce){.person{animation:none}}@media(min-width:850px){.sheet{left:auto;right:22px;top:90px;bottom:90px;width:390px;border-bottom:1px solid #60736d6b;border-radius:24px;max-height:none}#detail{max-height:calc(100dvh - 225px)}.scene-heading{left:30px;top:24px}.scene-heading h1{font-size:25px}}

<main class="scene" id="scene"><div class="scene-heading"><small>THE TEAM BEHIND THE WALL</small><h1>여기가 우리 사무실.</h1><p id="overview">직원을 터치해 작업을 확인하세요.</p></div>
<svg id="office" viewBox="0 0 600 930" aria-label="책상과 직원으로 보는 Last Wall 오피스"><defs><pattern id="wood" width="100" height="36" patternUnits="userSpaceOnUse"><rect width="100" height="36" fill="#b08e67"/><path d="M0 35H100M99 0V36M5 8H72M24 17H95" stroke="#816441" stroke-opacity=".22"/><path d="M2 1H98" stroke="#d7bb92" stroke-opacity=".35"/></pattern><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#b1d8d0" stop-opacity=".23"/><stop offset="1" stop-color="#b1d8d0" stop-opacity=".02"/></linearGradient><linearGradient id="window" x2="0" y2="1"><stop stop-color="#98bac2"/><stop offset="1" stop-color="#567c84"/></linearGradient><filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#091c24" flood-opacity=".3"/></filter></defs><g id="camera"><g id="environment"></g><g id="people"></g></g></svg>
<div class="controls"><button id="light" aria-label="오피스 조명 전환">☾</button><button id="fit" aria-label="사무실 전체 보기">⌗</button><button id="plus" aria-label="확대">＋</button><button id="minus" aria-label="축소">−</button></div><div class="floor-caption"><span>● 01F · 개발 본부</span><span>직원 터치 · 이동 · 확대</span></div></main>

<script>
'use strict';
const $=s=>document.getElementById(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defs=[{id:'owner',name:'형님',role:'오너 · 최종 방향과 게시 승인',room:'OWNER',x:140,y:195,color:'#bd9660',hair:'#334346'},{id:'chief',name:'총지휘',role:'작업 배분 · 코드 검토 · 통합 판단',room:'COMMAND',x:448,y:195,color:'#679788',hair:'#d8dac8'},{id:'codex',name:'Codex',role:'구현 · 테스트 · Studio 검증',room:'ENGINEERING',x:140,y:358,color:'#77a2bb',hair:'#2d3e49'},{id:'claude',name:'Claude 팀',role:'Sonnet · Opus · Haiku / 실제 모델은 기록으로 확인',room:'CREATIVE',x:448,y:358,color:'#ba8393',hair:'#b87982'},{id:'opus',name:'Opus',role:'고난도 시스템 · 서버 권한',room:'SYSTEMS',x:140,y:521,color:'#948bb3',hair:'#514850'},{id:'fable',name:'Fable',role:'독립 감사 · 어려운 검토',room:'AUDIT',x:448,y:521,color:'#b9b6a4',hair:'#e0cda7'},{id:'lightweight',name:'Haiku / Luna',role:'가벼운 구현 · 반복 작업 · 테스트 보강',room:'SUPPORT',x:140,y:684,color:'#9aa990',hair:'#aebfca'},{id:'studio',name:'Studio QA',role:'데스크톱 · 모바일 실제 검증',room:'QA LAB',x:448,y:684,color:'#739da1',hair:'#34464b'}];
let data={readOnly:true,mode:'locked',observedAt:null,issues:[],runners:[],studio:{owner:null}},selected=null,taskId=null,mode=null,priorFocus=null,keyText=new URLSearchParams(location.hash.slice(1)).get('k')||'',error='',loading=false,zoom=1,pan={x:0,y:0};
const colors={review:'#c4afea',claimed:'#a5bdf1',queued:'#e4c589',blocked:'#ee9d88',done:'#92cdb6',unknown:'#a5b6ab',manual:'#e0c38b'};
const statusText={review:'검토 대기',claimed:'클레임 · 실행 미확인',queued:'대기열',blocked:'차단됨',done:'종료 기록',unknown:'배정 미확인',manual:'수동 지휘'};
function stateOf(t){const ls=t?.labels||[];if(t?.state==='closed'||ls.includes('done'))return 'done';if(ls.includes('blocked'))return 'blocked';if(ls.some(l=>l.endsWith('-running')))return 'claimed';if(ls.some(l=>l.endsWith('-review')))return 'review';if(ls.some(l=>l.endsWith('-ready')))return 'queued';return 'unknown';}
function laneOf(t){const m=(t?.model||'').toLowerCase();if(m.includes('fable'))return 'fable';if(m.includes('opus'))return 'opus';if(m.includes('haiku')||m.includes('luna'))return 'lightweight';return t?.lane==='codex'?'codex':t?.lane==='claude'?'claude':null;}
function tasksOf(id){return data.issues.filter(t=>laneOf(t)===id);}
function stateOfSeat(id){if(['owner','chief'].includes(id))return 'manual';const ts=tasksOf(id);return ts.length?stateOf(ts[0]):'unknown';}
const date=v=>v&&Number.isFinite(Date.parse(v))?new Date(v).toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'기록 없음';
function duration(t){const a=Date.parse(t?.claimedAt),b=Date.parse(t?.claimEndedAt||data.observedAt);if(!Number.isFinite(a)||!Number.isFinite(b)||b<a)return null;return b-a;}
function elapsed(ms){if(ms===null||!Number.isFinite(ms))return '측정 안 됨';const s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');}
function rect(x,y,w,h,c,r=0){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${c}"/>`;}
function plant(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="9" rx="15" ry="7" fill="#16313a30"/>${rect(-10,-8,20,23,'#c6b990',4)}<path d="M0 1Q-24-19-14-34Q4-34 0 1M0 1Q22-20 16-38Q-5-33 0 1M0-1Q-9-41 0-50Q17-36 0-1" fill="#668a69"/><path d="M0 1V-28" stroke="#a0b383" stroke-width="2"/></g>`;}
function person(x,y,color,hair){return `<g transform="translate(${x} ${y})"><g class="person"><ellipse cx="0" cy="24" rx="24" ry="8" fill="#23313130"/>${rect(-13,14,10,19,'#424d4c',4)+rect(3,14,10,19,'#424d4c',4)+rect(-20,20,16,7,'#273b42',3)+rect(4,20,16,7,'#273b42',3)+rect(-20,-8,40,31,color,10)+rect(-25,0,9,20,'#dfb490',4)+rect(16,0,9,20,'#dfb490',4)+rect(-20,-41,40,38,'#e4b99a',12)+rect(-22,-43,44,15,hair,7)}<path d="M-21-33L-18-18-12-31M20-34L17-18 12-31" fill="${hair}"/>${rect(-10,-23,4,5,'#344046',2)+rect(7,-23,4,5,'#344046',2)}<path d="M-3-12Q0-9 4-12" fill="none" stroke="#b67963" stroke-width="1.7"/></g></g>`;}
function environment(){let s='<ellipse cx="305" cy="525" rx="277" ry="380" fill="#06151e50"/>'+rect(36,118,529,725,'#6e604c',7)+rect(30,106,529,724,'url(#wood)',5);
// Rear wall, windows, skyline, and the shared centre aisle.
s+=rect(24,76,541,55,'#435b5d',3)+rect(24,72,541,7,'#d1b791',2);
for(let x of [42,187,374]){s+=rect(x,87,x===187?164:123,35,'#223c46',1)+rect(x+6,91,x===187?152:111,24,'url(#window)');for(let j=0;j<5;j++)s+=rect(x+10+j*21,98+(j%3)*5,13,19-(j%3)*5,'#537882');}
s+='<text x="275" y="107" fill="#f4ddb2" font-size="18" font-weight="700" text-anchor="middle">LAST WALL</text><text x="275" y="120" fill="#c6d5ca" font-size="6" letter-spacing="2" text-anchor="middle">BUILD SOMETHING WORTH DEFENDING</text>';
s+=rect(248,131,85,600,'#827e6840');for(let y=151;y<727;y+=41)s+=rect(289,y,6,14,'#eee0b27d',2);
// Individual workspace rugs and low glass dividers, never UI cards.
for(let r of defs){let left=r.x-100;s+=rect(left,r.y-53,194,151,'#30474b35',2);s+='<text x="'+r.x+'" y="'+(r.y-38)+'" font-size="9" letter-spacing="2" text-anchor="middle" fill="#504f44">'+r.room+'</text>';s+=rect(left-3,r.y-56,5,108,'#b7c5b147')+rect(left-3,r.y-56,185,3,'#b7c5b1a0')+rect(left-3,r.y-53,185,25,'url(#glass)');}
s+=rect(20,123,7,699,'#82989580')+rect(565,123,7,699,'#82989580');
for(let [x,y] of [[50,164],[551,162],[234,304],[357,304],[46,469],[550,469],[236,630],[357,630]])s+=plant(x,y,.7);
// Lounge, meeting table, coffee corner, shelves, and plants.
s+=rect(49,766,108,25,'#647c7560',9)+rect(44,746,110,35,'#8f9e84',7)+rect(49,746,10,43,'#aab494',4)+rect(143,746,10,43,'#aab494',4)+rect(64,779,74,30,'#8b6b4b',6)+rect(71,781,60,23,'#c6a777',4);
s+=rect(211,773,151,16,'#826044',4)+rect(204,750,165,29,'#d2b181',7);for(let x of [220,268,316])s+=rect(x,739,27,16,'#607b79',5)+rect(x,788,27,16,'#607b79',5);
s+=rect(420,754,101,30,'#63746b',5)+rect(416,744,109,13,'#bdb18e',3)+rect(425,720,25,27,'#384d50',3)+rect(430,724,14,11,'#9eaa90',2)+rect(472,731,13,15,'#ece0be',2)+plant(550,789,.9);
s+='<text x="286" y="818" font-size="10" fill="#5b594b" text-anchor="middle" letter-spacing="3">MAKE GOOD GAMES. TOGETHER.</text>';$('environment').innerHTML=s;}
function drawSeats(){const focused=document.activeElement?.dataset?.seat;$('people').innerHTML=defs.map(r=>{const st=stateOfSeat(r.id),col=colors[st],task=tasksOf(r.id)[0];let s=rect(r.x-70,r.y+27,6,20,'#565e54')+rect(r.x+64,r.y+27,6,20,'#565e54')+rect(r.x-80,r.y-4,160,40,'#856448',4)+rect(r.x-81,r.y-12,162,41,'#c6a47b',4);for(let dx of [-52,5]){s+=rect(r.x+dx,r.y-47,49,31,'#2c4247',3)+rect(r.x+dx+4,r.y-43,41,23,'#45646b',1)+rect(r.x+dx+19,r.y-16,8,6,'#657970')+rect(r.x+dx+13,r.y-10,21,3,'#53695f');for(let j=0;j<4;j++)s+=rect(r.x+dx+8,r.y-39+j*5,14+(j%3)*6,2,j===0?col:'#91aa9870');}s+=rect(r.x-25,r.y+3,50,9,'#748278',2)+rect(r.x+45,r.y+6,9,12,'#f0dfb7',2)+rect(r.x-66,r.y+2,16,17,'#e5d6b2',1)+rect(r.x-22,r.y+41,44,37,'#476064',11);s+=person(r.x,r.y+49,r.color,r.hair);s+='<ellipse class="halo" cx="'+r.x+'" cy="'+(r.y+73)+'" rx="34" ry="14"/><circle cx="'+(r.x-57)+'" cy="'+(r.y+100)+'" r="4" fill="'+col+'"/><text class="name" x="'+r.x+'" y="'+(r.y+104)+'">'+r.name+'</text><text class="subname" x="'+r.x+'" y="'+(r.y+121)+'">'+(task?'#'+task.number+' · '+statusText[st]:r.id==='studio'?'점유 미확인':statusText[st])+'</text>';return '<g class="seat'+(selected===r.id?' selected':'')+'" tabindex="0" role="button" data-seat="'+r.id+'" aria-label="'+r.name+' 작업 상세"><rect x="'+(r.x-87)+'" y="'+(r.y-53)+'" width="174" height="180" fill="transparent"/>'+s+'</g>';}).join('');for(let el of document.querySelectorAll('.seat')){el.onclick=()=>showPerson(el.dataset.seat);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showPerson(el.dataset.seat);}};}if(focused&&!mode)document.querySelector('[data-seat="'+focused+'"]')?.focus({preventScroll:true});}
function refreshHeading(){const loaded=data.mode!=='locked';$('sourceButton').textContent=loaded?'개인 기록 · '+date(data.observedAt)+' ↗':'개인 기록 잠김 ↗';$('overview').textContent=loaded?'검토 대기 '+data.issues.filter(t=>stateOf(t)==='review').length+'건 · 저장된 GitHub 기록':'직원을 터치해 작업을 확인하세요.';}
function openSheet(m){if(!mode)priorFocus=document.activeElement;mode=m;$('sheet').hidden=false;$('scrim').hidden=false;$('detail').scrollTop=0;$('close').focus({preventScroll:true});}
function closeSheet(){mode=null;$('sheet').hidden=true;$('scrim').hidden=true;priorFocus?.focus?.({preventScroll:true});}
function showPerson(id,n=null){selected=id;taskId=n;renderPerson();drawSeats();openSheet('person');}
function renderPerson(){const r=defs.find(r=>r.id===selected),ts=tasksOf(selected),t=ts.find(t=>t.number===taskId)||ts[0],st=t?stateOf(t):stateOfSeat(selected);$('sheet').setAttribute('aria-label',r.name+' 작업 상세');$('detail').innerHTML='<div class="eyebrow">MEET THE TEAM</div><h2>'+esc(r.name)+'</h2><p class="muted">'+esc(r.role)+'</p><span class="status" style="color:'+colors[st]+'">'+esc(statusText[st])+'</span><div class="current"><small class="eyebrow">CURRENT ASSIGNMENT</small><b>'+esc(t?'#'+t.number+' '+t.title:['owner','chief'].includes(r.id)?'기획 · 판단 · 최종 확인':'확인된 작업 기록이 없습니다.')+'</b></div><small class="muted">GitHub 클레임 구간</small><div class="timer">'+elapsed(duration(t))+'</div><p class="notice">클레임부터 해제·검토까지의 기록입니다. 실제 코딩 시간은 아닙니다. 실행시간과 heartbeat는 로컬 신호가 없어 측정하지 않았습니다.</p><dl><dt>클레임 시작</dt><dd>'+date(t?.claimedAt)+'</dd><dt>해제 / 검토</dt><dd>'+date(t?.claimEndedAt)+'</dd><dt>실제 실행 모델</dt><dd>'+esc(t?.model||'기록 없음')+'</dd><dt>브랜치</dt><dd>'+esc(t?.branch||'기록 없음')+'</dd><dt>마지막 관측</dt><dd>'+date(data.observedAt)+'</dd><dt>Studio 담당자</dt><dd>실제 점유 미확인</dd></dl>'+(t?.summary?'<h3>기록된 결과</h3><p class="muted">'+esc(t.summary)+'</p>':'')+(ts.length>1?'<h3>이 팀의 다른 작업</h3>'+ts.map(x=>'<button class="row" data-task="'+x.number+'">#'+x.number+' '+esc(x.title)+'</button>').join(''):'')+(t?'<a class="row" target="_blank" rel="noopener noreferrer" href="https://github.com/macchiatopsk-create/LastWall/issues/'+Number(t.number)+'">GitHub 이슈 #'+Number(t.number)+' ↗</a>':'')+(t?.pr?'<a class="row" target="_blank" rel="noopener noreferrer" href="https://github.com/macchiatopsk-create/LastWall/pull/'+Number(t.pr)+'">Draft PR #'+Number(t.pr)+' ↗</a>':'')+'<p class="muted">아바타의 움직임은 사무실 연출입니다. 작업 실행이나 완료를 뜻하지 않습니다.</p>';bindTasks();}
function bindTasks(){document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const t=data.issues.find(t=>t.number===Number(b.dataset.task)),id=laneOf(t);if(id)showPerson(id,t.number);});}
function showTasks(){selected=null;$('detail').innerHTML='<div class="eyebrow">THE WORK</div><h2>우리 팀의 작업</h2><p class="muted">'+date(data.observedAt)+' 관측 · 현재 기록은 실시간이 아닌 저장본입니다.</p>'+data.issues.map(t=>'<button class="row" data-task="'+t.number+'">#'+t.number+' '+esc(t.title)+'<small>'+statusText[stateOf(t)]+' · 클레임 구간 '+elapsed(duration(t))+'</small></button>').join('')+(!data.issues.length?'<p class="notice">전달받은 개인 링크로 열면 보호된 작업 기록이 나타납니다.</p>':'');bindTasks();openSheet('tasks');}
function showTeam(){$('detail').innerHTML='<div class="eyebrow">OUR PEOPLE</div><h2>우리 팀</h2>'+defs.map(r=>'<button class="row" data-person="'+r.id+'">'+r.name+'<small>'+esc(r.role)+'</small></button>').join('');document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>showPerson(b.dataset.person));openSheet('team');}
function showConnection(){$('detail').innerHTML='<div class="eyebrow">PRIVATE OFFICE</div><h2>나의 기록</h2><p class="muted">설치 없이 이 주소를 북마크해서 사용하세요.</p><dl><dt>데이터</dt><dd>'+(data.mode==='locked'?'개인 기록 잠김':'암호화된 GitHub 저장본')+'</dd><dt>관측 시각</dt><dd>'+date(data.observedAt)+'</dd><dt>실시간 갱신</dt><dd>자동 수집 미연결</dd><dt>실행시간 / 심박</dt><dd>로컬 신호 미수집</dd></dl><p class="notice">현재는 확인한 GitHub 상태를 저장해 보여줍니다. 새로고침은 최신 게시본을 읽으며, 계속 작업 중이라고 추정하지 않습니다.</p>'+(error?'<p class="muted">'+esc(error)+'</p>':'')+'<button class="row" id="reload">게시된 기록 새로고침 ↻</button><p class="muted">개인 링크의 키로 브라우저에서 작업 내용을 복호화합니다. 링크를 받은 사람도 볼 수 있으므로 공유하지 마세요. GitHub 로그인으로 소유자를 확인하는 방식은 아닙니다.</p><p class="muted">조회 전용 · 게임 게시 없음 · 작업 중단 없음 · 토큰 입력 없음</p>';$('reload').onclick=()=>load(true);openSheet('connection');}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3800);}
function decode64(s){const v=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(v.padEnd(Math.ceil(v.length/4)*4,'=')),c=>c.charCodeAt(0));}
async function decryptRecord(record,key){if(record?.version!==1||record.algorithm!=='AES-256-GCM')throw Error('지원하지 않는 기록입니다.');const raw=decode64(key);if(raw.length!==32)throw Error('개인 링크의 키를 확인해주세요.');const ck=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode64(record.iv)},ck,decode64(record.data));const v=JSON.parse(new TextDecoder().decode(clear));if(v?.readOnly!==true||!Array.isArray(v.issues)||v.issues.length>1000)throw Error('올바르지 않은 기록입니다.');return v;}
async function load(manual=false){if(loading)return;loading=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{if(!keyText)throw Error('개인 링크로 열면 작업 기록이 표시됩니다.');const r=await fetch('./status.enc.json',{credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:controller.signal});if(!r.ok)throw Error('기록을 가져오지 못했습니다.');data=await decryptRecord(await r.json(),keyText);error='';drawSeats();refreshHeading();if(manual)toast('게시된 개인 기록을 읽었습니다.');}catch(e){error=e.name==='AbortError'?'연결 시간이 초과되었습니다.':e.message||'개인 기록을 열지 못했습니다.';if(manual)toast(error);}finally{loading=false;clearTimeout(timer);if(mode==='connection')showConnection();if(mode==='person')renderPerson();}}
function transform(){$('camera').setAttribute('transform',`translate(${pan.x} ${pan.y}) translate(300 440) scale(${zoom}) translate(-300 -440)`);}
function changeZoom(f){zoom=Math.max(.8,Math.min(2.8,zoom*f));transform();}
function fit(){zoom=1;pan={x:0,y:0};transform();}
$('plus').onclick=()=>changeZoom(1.2);$('minus').onclick=()=>changeZoom(1/1.2);$('fit').onclick=fit;$('light').onclick=()=>{document.body.classList.toggle('night');$('light').textContent=document.body.classList.contains('night')?'☀':'☾';};
const pointers=new Map();let gesture=null,moved=false;
$('office').addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...pointers.values()];gesture={x:e.clientX,y:e.clientY,pan:{...pan},zoom,distance:p.length===2?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0};moved=false;});
$('office').addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!gesture)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const ps=[...pointers.values()];if(ps.length===2&&gesture.distance){zoom=Math.max(.8,Math.min(2.8,gesture.zoom*Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)/gesture.distance));moved=true;}else{const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;const rect=$('office').getBoundingClientRect(),scale=Math.min(rect.width/600,rect.height/930);pan={x:Math.max(-450,Math.min(450,gesture.pan.x+dx/scale)),y:Math.max(-700,Math.min(700,gesture.pan.y+dy/scale))};}transform();});
for(let type of ['pointerup','pointercancel','pointerleave'])$('office').addEventListener(type,e=>{pointers.delete(e.pointerId);if(!pointers.size)gesture=null;});
$('office').addEventListener('click',e=>{if(moved){e.stopPropagation();moved=false;}},true);
$('close').onclick=closeSheet;$('scrim').onclick=closeSheet;$('sourceButton').onclick=showConnection;
for(let b of document.querySelectorAll('[data-nav]'))b.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.nav==='home'){closeSheet();fit();}else if(b.dataset.nav==='team')showTeam();else if(b.dataset.nav==='tasks')showTasks();else showConnection();};
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Tab'&&mode){const es=[...$('sheet').querySelectorAll('button,a')],a=es[0],z=es.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
window.addEventListener('hashchange',()=>{keyText=new URLSearchParams(location.hash.slice(1)).get('k')||'';data={readOnly:true,mode:'locked',observedAt:null,issues:[],runners:[],studio:{owner:null}};closeSheet();drawSeats();refreshHeading();load();});
environment();drawSeats();refreshHeading();load();setInterval(()=>{if(!document.hidden)load();},60000);
window.HQOffice={version:'3.1-pages',stateOf,elapsed,duration,decryptRecord,getView:()=>({zoom,selected,mode,locked:data.mode==='locked',seats:defs.length})};
</script></body></html>
