<!doctype html>

<style>
:root{color-scheme:dark;--bg:#071018;--panel:#0c1923;--panel2:#102430;--gold:#edc47f;--gold2:#ffdca1;--text:#f8f0e3;--muted:#a8b5bd;--line:rgba(180,202,215,.15);--green:#43d889;--yellow:#f5b948;--purple:#b28cff;--red:#ff6b72;--gray:#8a98a3}*{box-sizing:border-box}html,body{margin:0;background:#050a0f;color:var(--text);font-family:Inter,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}body{min-height:100vh}button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}.app{max-width:560px;margin:0 auto;min-height:100dvh;background:linear-gradient(180deg,#071018,#0a151d 55%,#071018);box-shadow:0 0 80px #0008}.top{position:sticky;top:0;z-index:30;background:rgba(5,12,18,.97);backdrop-filter:blur(18px);padding:14px 16px 12px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.appicon{width:54px;height:54px;border-radius:17px;border:1px solid rgba(237,196,127,.5);background:linear-gradient(145deg,#2a231b,#0d151b);display:grid;place-items:center;box-shadow:inset 0 0 28px rgba(237,196,127,.08)}.appicon span{display:flex;gap:4px;align-items:flex-end;height:28px}.appicon i{display:block;width:6px;border-radius:5px;background:linear-gradient(#ffe4ad,#d69b4e)}.appicon i:nth-child(1){height:17px}.appicon i:nth-child(2){height:27px}.appicon i:nth-child(3){height:22px}.brandtxt{min-width:0;flex:1}.brandtxt h1{margin:0;font:700 26px/1 Georgia,"Times New Roman",serif;color:#f1d3a2;letter-spacing:.2px}.brandtxt p{margin:5px 0 0;color:#94a6b1;font-size:10px;letter-spacing:2px}.topactions{display:flex;gap:7px}.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#0c1721;font-size:19px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px;padding:4px;border-radius:18px;border:1px solid var(--line);background:#050d13}.tab{height:58px;border:0;border-radius:14px;background:transparent;color:#9eadb5;font-weight:700;font-size:16px}.tab.active{color:#ffe0a7;background:linear-gradient(145deg,rgba(237,196,127,.22),rgba(237,196,127,.07));box-shadow:inset 0 0 0 1px rgba(237,196,127,.32)}.screen{display:none}.screen.active{display:block}.stage{position:relative;overflow:hidden;background:#0b1218}.heroimg{display:block;width:100%;height:auto;min-height:690px;object-fit:cover;object-position:center top}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.04) 0,transparent 25%,transparent 74%,rgba(3,8,12,.45) 100%)}.chip{position:absolute;z-index:5;display:flex;align-items:center;gap:7px;border:1px solid rgba(160,191,205,.25);background:rgba(6,15,22,.88);backdrop-filter:blur(9px);padding:7px 10px;border-radius:14px;box-shadow:0 8px 24px #0008;min-height:44px}.chip strong{font-size:12px}.chip small{font-size:9px;color:#b2c0c6}.dot{width:9px;height:9px;border-radius:50%;background:var(--gray);box-shadow:0 0 10px rgba(138,152,163,.35)}.chip[data-state="working"] .dot{background:var(--green);box-shadow:0 0 10px rgba(67,216,137,.5)}.chip[data-state="claimed"] .dot{background:var(--yellow);box-shadow:0 0 10px rgba(245,185,72,.5)}.chip[data-state="review"] .dot{background:var(--purple);box-shadow:0 0 10px rgba(178,140,255,.5)}.chip[data-state="blocked"] .dot{background:var(--red);box-shadow:0 0 10px rgba(255,107,114,.5)}#office-owner{left:50%;top:27%;transform:translateX(-50%)}#office-codex{left:7%;top:47%}#office-fable{right:7%;top:47%}#office-claude{left:8%;top:72%}#office-studio{left:50%;top:72%;transform:translateX(-50%)}#office-opus{right:8%;top:72%}.summary{position:absolute;left:14px;right:14px;bottom:14px;z-index:6;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:11px 14px;border-radius:17px;background:rgba(5,14,21,.9);border:1px solid rgba(164,190,204,.18);backdrop-filter:blur(10px);font-size:10px}.summary span{display:flex;align-items:center;gap:6px;color:#c2cdd2}.summary .dot{width:8px;height:8px}.meeting-stage .heroimg{min-height:720px}.meeting-stage:before{content:"";position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;z-index:1;background:linear-gradient(90deg,rgba(2,7,11,.28),transparent 18%,transparent 82%,rgba(2,7,11,.28))}.meeting-chip{z-index:6}.meeting-chip.owner{left:50%;top:31%;transform:translateX(-50%)}.meeting-chip.astra{left:19%;top:44%}.meeting-chip.codex{left:9%;top:61%}.meeting-chip.fable{right:19%;top:44%}.meeting-chip.chief{left:50%;bottom:15%;transform:translateX(-50%)}.chatbar{position:absolute;left:14px;right:14px;bottom:14px;z-index:7;height:60px;border-radius:18px;border:1px solid rgba(162,192,205,.18);background:rgba(4,12,18,.93);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:0 14px}.chatbar b{font-size:13px}.chatbar span{font-size:10px;color:#9eacb3}.chatbar button{margin-left:auto;width:42px;height:42px;border:0;border-radius:12px;background:#162c3a}.bottom{position:sticky;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:rgba(5,12,18,.97);border-top:1px solid var(--line);backdrop-filter:blur(18px)}.nav{border:0;background:transparent;min-height:55px;border-radius:14px;color:#91a2ad;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav em{font-style:normal;font-size:22px}.nav.active{background:#122a39;color:#ffe0a7}.sheetback{display:none;position:fixed;inset:0;background:#0008;z-index:50}.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);z-index:51;background:linear-gradient(180deg,#10212b,#07131b);border:1px solid rgba(178,205,218,.18);border-radius:24px 24px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));transition:.25s;box-shadow:0 -20px 60px #000b}.sheet.open{transform:translate(-50%,0)}.sheetback.show{display:block}.grab{width:50px;height:5px;border-radius:10px;background:#ffffff24;margin:0 auto 13px}.sheethead{display:flex;align-items:center;gap:10px}.sheethead h2{margin:0;font-size:25px}.close{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#102531}.pill{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:#b6c3c8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.box{border:1px solid rgba(170,197,210,.1);background:#ffffff05;border-radius:15px;padding:12px}.box.wide{grid-column:1/-1}.box label{display:block;font-size:10px;color:#93a5ae;margin-bottom:6px}.box b{font-size:14px}.muted{font-size:10px;color:#8fa0a8;line-height:1.6;margin-top:12px}.installhint{display:none;padding:10px 12px;margin:0 14px 12px;border:1px solid rgba(237,196,127,.22);border-radius:14px;background:#2a21175e;font-size:11px;color:#dbc396}.installhint button{float:right;border:0;background:none;color:#ffe1ad;font-weight:700}@media(max-width:380px){.brandtxt h1{font-size:22px}.heroimg{min-height:650px}.chip{padding:6px 8px}.chip strong{font-size:11px}.chip small{font-size:8px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="appicon" aria-hidden="true"><span><i></i><i></i><i></i></span></div><div class="brandtxt"><h1>Last Wall HQ</h1><p>PROJECT COMMAND CENTER</p></div><div class="topactions"><button class="round" id="installBtn" aria-label="앱 설치">↓</button><button class="round" id="infoBtn" aria-label="정보">i</button></div></div><div class="tabs"><button class="tab active" data-tab="office">⌂ 사무실</button><button class="tab" data-tab="meeting">◎ 회의실</button></div></header>
<div class="installhint" id="installHint">홈 화면에 설치하면 전용 아이콘으로 열립니다.<button id="installHintBtn">설치</button></div>
<main>
<section class="screen active" id="office"><div class="stage office-stage"><img class="heroimg" src="./office-v13.webp?v=13" alt="Last Wall HQ 사무실"><button class="chip" id="office-owner" data-person="owner" data-state="idle"><i class="dot"></i><span><strong>♛ 형님</strong><small>총괄</small></span></button><button class="chip" id="office-codex" data-person="codex" data-state="review"><i class="dot"></i><span><strong>Codex</strong><small>검토 대기</small></span></button><button class="chip" id="office-fable" data-person="fable" data-state="idle"><i class="dot"></i><span><strong>Fable</strong><small>대기</small></span></button><button class="chip" id="office-claude" data-person="claude" data-state="idle"><i class="dot"></i><span><strong>Claude</strong><small>대기</small></span></button><button class="chip" id="office-studio" data-person="studio" data-state="idle"><i class="dot"></i><span><strong>Studio QA</strong><small>대기</small></span></button><button class="chip" id="office-opus" data-person="opus" data-state="idle"><i class="dot"></i><span><strong>Opus</strong><small>대기</small></span></button><div class="summary"><span><i class="dot" style="background:var(--green)"></i>작업중 0</span><span><i class="dot" style="background:var(--yellow)"></i>클레임 0</span><span><i class="dot" style="background:var(--purple)"></i>검토 1</span><span><i class="dot"></i>대기 4</span></div></div></section>
<section class="screen" id="meeting"><div class="stage meeting-stage"><img class="heroimg" src="./meeting-v13.webp?v=13" alt="Last Wall HQ 회의실"><button class="chip meeting-chip owner" data-person="owner" data-state="idle"><i class="dot"></i><span><strong>♛ 형님</strong><small>상석</small></span></button><button class="chip meeting-chip astra" data-person="astra" data-state="idle"><i class="dot"></i><span><strong>Astra</strong><small>미연결</small></span></button><button class="chip meeting-chip codex" data-person="codex" data-state="review"><i class="dot"></i><span><strong>Codex</strong><small>검토 대기</small></span></button><button class="chip meeting-chip fable" data-person="fable" data-state="idle"><i class="dot"></i><span><strong>Fable</strong><small>대기</small></span></button><button class="chip meeting-chip chief" data-person="chief" data-state="idle"><i class="dot"></i><span><strong>총지휘</strong><small>대기</small></span></button><div class="chatbar"><div><b>회의실 대화</b><br><span>AI 브리지 연결 대기</span></div><button id="chatBtn">›</button></div></div></section>
</main>
<nav class="bottom"><button class="nav active" data-tab="office"><em>⌂</em>사무실</button><button class="nav" data-tab="meeting"><em>◎</em>회의실</button><button class="nav" id="logBtn"><em>☷</em>작업 기록</button><button class="nav" id="moreBtn"><em>•••</em>더보기</button></nav>
</div>
<div class="sheetback" id="sheetBack"></div><section class="sheet" id="sheet" aria-hidden="true"><div class="grab"></div><div class="sheethead"><h2 id="sheetName">Codex</h2><span class="pill"><i class="dot" id="sheetDot"></i><span id="sheetState">검토 대기</span></span><button class="close" id="sheetClose">×</button></div><div class="grid"><div class="box"><label>담당</label><b id="sheetRole">구현 · 테스트</b></div><div class="box"><label>현재 작업</label><b id="sheetTask">HQ 연결 preflight</b></div><div class="box"><label>실행 시간</label><b id="sheetTime">측정 안 됨</b></div><div class="box"><label>진행률</label><b id="sheetProgress">미기록</b></div><div class="box wide"><label>최근 업데이트</label><b id="sheetUpdate">실시간 브리지 연결 전</b></div></div><div class="muted">초록 작업중은 실제 프로세스와 신선한 heartbeat가 모두 확인될 때만 표시합니다.</div></section>
<script>
const PEOPLE={owner:{name:'형님',role:'오너 · 최종 결정',task:'전체 방향 검토',state:'대기',time:'측정 안 됨',progress:'미기록',update:'필요 시 검토'},chief:{name:'총지휘',role:'통합 · 오케스트레이션',task:'HQ/프로젝트 조율',state:'대기',time:'측정 안 됨',progress:'미기록',update:'로컬 브리지 연결 대기'},codex:{name:'Codex',role:'구현 · 테스트',task:'HQ local preflight #212',state:'검토 대기',time:'작업 구간 기록됨',progress:'미기록',update:'Draft PR #213 제출'},fable:{name:'Fable',role:'감사 · 어려운 검토',task:'감사 대기',state:'대기',time:'측정 안 됨',progress:'미기록',update:'실행 증거 없음'},astra:{name:'Astra',role:'전략 · 조율',task:'상위 리뷰 슬롯',state:'미연결',time:'측정 안 됨',progress:'미기록',update:'연결되지 않음'},claude:{name:'Claude',role:'구현 · 리뷰',task:'현재 배정 없음',state:'대기',time:'측정 안 됨',progress:'미기록',update:'실행 증거 없음'},opus:{name:'Opus',role:'고난도 리뷰',task:'현재 배정 없음',state:'대기',time:'측정 안 됨',progress:'미기록',update:'실행 증거 없음'},studio:{name:'Studio QA',role:'Studio 검증',task:'현재 배정 없음',state:'대기',time:'측정 안 됨',progress:'미기록',update:'Studio 세션 미확인'}};
const qs=s=>document.querySelector(s),qsa=s=>[...document.querySelectorAll(s)];function setTab(id){qsa('.screen').forEach(x=>x.classList.toggle('active',x.id===id));qsa('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));window.scrollTo({top:0,behavior:'smooth'});}qsa('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));function openPerson(id){const p=PEOPLE[id]||PEOPLE.owner;qs('#sheetName').textContent=p.name;qs('#sheetState').textContent=p.state;qs('#sheetRole').textContent=p.role;qs('#sheetTask').textContent=p.task;qs('#sheetTime').textContent=p.time;qs('#sheetProgress').textContent=p.progress;qs('#sheetUpdate').textContent=p.update;qs('#sheetDot').style.background=p.state.includes('검토')?'var(--purple)':p.state.includes('작업')?'var(--green)':p.state.includes('차단')?'var(--red)':'var(--gray)';qs('#sheetBack').classList.add('show');qs('#sheet').classList.add('open');qs('#sheet').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}qsa('[data-person]').forEach(b=>b.addEventListener('click',()=>openPerson(b.dataset.person)));function closeSheet(){qs('#sheetBack').classList.remove('show');qs('#sheet').classList.remove('open');qs('#sheet').setAttribute('aria-hidden','true');document.body.style.overflow='';}qs('#sheetBack').onclick=closeSheet;qs('#sheetClose').onclick=closeSheet;qs('#infoBtn').onclick=()=>openPerson('chief');qs('#logBtn').onclick=()=>openPerson('codex');qs('#moreBtn').onclick=()=>openPerson('owner');qs('#chatBtn').onclick=()=>openPerson('chief');let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;qs('#installHint').style.display='block'});async function install(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;qs('#installHint').style.display='none'}else{alert('브라우저 메뉴에서 “홈 화면에 추가” 또는 “앱 설치”를 선택하면 Last Wall HQ 아이콘으로 설치됩니다.')}}qs('#installBtn').onclick=install;qs('#installHintBtn').onclick=install;
</script>
</body></html>
