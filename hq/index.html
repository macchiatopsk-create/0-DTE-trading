<style>

}.eyebrow{font-size:10px;letter-spacing:1.9px;color:var(--gold);margin:0 0 6px}h2{font-size:24px;letter-spacing:-.5px;margin:0 0 8px}.intro{font-size:12px;color:var(--dim);line-height:1.8;margin:0 0 16px}.participants{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.person{border:1px solid var(--line);border-radius:25px;padding:7px 12px;background:#152831;font-size:12px}.person:first-child{color:#edcda0;border-color:#b0966166}.readonly{font-size:11px;color:#c1c8c5;padding:11px 13px;border-radius:9px;background:#9b987913;border:1px solid #b4a47733;margin:13px 0 20px}.meeting-tabs{display:flex;border-bottom:1px solid var(--line);gap:18px;margin-bottom:18px}.meeting-tabs button{border:0;border-bottom:2px solid transparent;background:none;min-height:44px;color:var(--dim);font-size:13px;padding:6px 2px}.meeting-tabs button[aria-selected=true]{color:#f5dcb0;border-color:var(--gold)}.agenda{border:1px solid var(--line);border-radius:13px;padding:16px;background:#142731;margin:12px 0}.agenda h3{font-size:16px;line-height:1.5;margin:0 0 8px}.agenda p{font-size:12px;color:#c0cdd1;line-height:1.8;margin:8px 0}.badge{display:inline-block;color:#d5c197;border:1px solid #b99b5d55;border-radius:20px;padding:3px 8px;font-size:10px;margin:0 0 10px}.decision{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.decision b{font-size:12px;color:var(--gold);border:1px solid #b79a6555;border-radius:8px;width:28px;height:28px;display:grid;place-items:center;flex-shrink:0}.decision p{font-size:13px;margin:0;color:#d9e0da}.decision small{font-size:10px;color:#aebec2;display:block;margin-top:6px}.log-message{border:1px solid var(--line);background:#132630;border-radius:3px 13px 13px 13px;margin:15px 0;padding:13px}.log-message header{font-size:12px;color:#e6ca95;font-weight:600}.log-message header small{display:block;color:#95aab5;font-size:10px;font-weight:400}.log-message p{font-size:13px;line-height:1.9;white-space:pre-wrap;margin:10px 0 2px;color:#d2dce0}.empty{border:1px dashed #7b92994d;border-radius:12px;padding:20px 16px;color:#b8c6cd;font-size:12px;line-height:1.9}.source-note{font-size:11px;color:#96aab1;margin-top:15px;line-height:1.8}.composer-note{margin-top:24px;border-radius:10px;border:1px solid #71899735;background:#0b1922;padding:13px;color:#93aab7;font-size:12px;line-height:1.8}.composer-note strong{display:block;color:#c8d0d0;font-weight:500;margin-bottom:3px}dialog{padding:0;border:1px solid #5f7b88;background:#101f28;color:var(--text);border-radius:22px 22px 0 0;margin:auto auto 0;width:min(560px,100%);max-width:100%;max-height:82dvh;box-shadow:0 -10px 80px #0007;overflow:hidden}dialog::backdrop{background:#040d17a3;backdrop-filter:blur(2px)}.dialog-head{padding:22px 20px 13px;border-bottom:1px solid var(--line);position:relative;background:#162a34}.dialog-head:before{content:'';position:absolute;top:8px;left:calc(50% - 17px);width:34px;height:3px;background:#748894;border-radius:2px}.dialog-head h2{font-size:22px;margin-right:40px}.dialog-head p{font-size:11px;color:var(--dim);margin:0 40px 0 0}.close{position:absolute;right:10px;top:14px;width:44px;height:44px;background:#233b4877;border:0;border-radius:12px;font-size:24px;color:#bfcbd2}.dialog-body{padding:18px 20px max(26px,env(safe-area-inset-bottom));overflow:auto;max-height:calc(82dvh - 115px);overscroll-behavior:contain}.dialog-body h3{font-size:15px;line-height:1.7;margin:14px 0 8px}.dialog-body .task-title{font-size:18px}.timer{font-size:28px;font-variant-numeric:tabular-nums;color:#ebd09c;margin:9px 0 0}.muted{font-size:12px;line-height:1.8;color:#a8bbc7}.meta{display:grid;grid-template-columns:94px minmax(0,1fr);gap:12px 8px;font-size:12px;line-height:1.7;margin:18px 0}.meta dt{color:var(--dim)}.meta dd{margin:0;overflow-wrap:anywhere;color:#dbe1e1}.task-link{display:block;width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#1c3440;padding:12px;margin:9px 0;text-decoration:none;color:#cee2ee;text-align:left;font-size:12px}.task-link small{display:block;font-size:11px;color:#a4bac4}.detail-summary{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.85}.divider{border-top:1px solid var(--line);margin-top:20px;padding-top:10px}.app:has(dialog[open]){pointer-events:none}noscript{display:block;padding:12px;text-align:center;font-size:12px;background:#31402d}body.modal-open{overflow:hidden}@media(min-width:800px){.app{margin:20px auto;border:1px solid var(--line);border-radius:18px;overflow:clip}.header{border-radius:18px 18px 0 0}dialog{margin:auto;border-radius:18px;max-height:85vh}.dialog-head:before{display:none}.dialog-body{max-height:calc(85vh - 110px)}}@media(max-width:355px){.header{padding-left:10px;padding-right:10px}.room{padding:6px 3px;border-radius:9px;min-height:60px}.room strong{font-size:12px}.room small{font-size:10px;margin-top:4px}.scene{aspect-ratio:9/15}.room-meeting{min-height:54px}}
</style></head><body><noscript>작업 기록과 회의실을 열려면 JavaScript가 필요합니다. 그림은 실제 작업 영상이 아닙니다.</noscript><div class="app" id="app"><header class="header"><div class="brand-row"><div class="brand"><span class="monogram" aria-hidden="true">▥</span><div><h1>Last Wall <span style="color:var(--gold)">HQ</span></h1><p id="snapshot">개인 오피스 · 기록 잠김</p></div></div><button id="connection" aria-label="연결 정보와 작업 목록">ⓘ</button></div><div class="tabs" role="tablist" aria-label="오피스 공간"><button id="office-tab" role="tab" aria-controls="office-panel" aria-selected="true"><i>⌂</i>사무실</button><button id="meeting-tab" role="tab" aria-controls="meeting-panel" aria-selected="false"><i>◎</i>회의실</button></div></header>
<main><section id="office-panel" role="tabpanel" aria-labelledby="office-tab"><div class="scene" id="scene"><img class="art" id="art" src="./office-art.avif?v=7" width="720" height="1120" alt="중앙 집무석이 주변 팀원 책상과 회의 테이블을 바라보는 따뜻한 세로형 사무실."><div class="image-error" id="image-error" hidden><p>사무실 그림을 불러오지 못했습니다.<br>아래에서 같은 팀원 기록을 열 수 있습니다.</p><div class="rooms-directory" id="rooms-directory"></div></div>
<button class="room room-owner" data-room="owner"><strong>♛ 형님</strong><small>중앙 집무실</small></button><button class="room room-codex" data-room="codex"><strong>Codex</strong><small>기록 잠김</small></button><button class="room room-fable" data-room="fable"><strong>Fable</strong><small>기록 잠김</small></button><button class="room room-claude" data-room="claude"><strong>Claude</strong><small>기록 잠김</small></button><button class="room room-opus" data-room="opus"><strong>Opus</strong><small>기록 잠김</small></button><button class="room room-studio" data-room="studio"><strong>Studio QA</strong><small>점유 미확인</small></button><button class="room room-chief" data-room="chief"><strong>총지휘</strong><small>검토 · 통합</small></button><button class="room room-meeting" id="meeting-room"><strong>◎ 회의실</strong><small>안건 · 기록 ↗</small></button><div class="scene-note"><span>방을 터치해 상세 보기</span><span>PHASE 01</span></div></div></section>
<section class="meeting" id="meeting-panel" role="tabpanel" aria-labelledby="meeting-tab" hidden><p class="eyebrow">THE ROUND TABLE</p><h2>함께 정리하는 회의실</h2><p class="intro">안건을 모으고, 결정사항을 남기는 공간.</p><div class="participants" aria-label="회의 역할 구성, 접속 상태가 아님"><span class="person">♛ 형님</span><span class="person">총지휘</span><span class="person">Fable</span></div><div class="readonly">1차 · 기록 열람용 / 실제 AI 채팅은 미연결</div><div class="meeting-tabs" role="tablist" aria-label="회의 기록 분류"><button id="agenda-tab" data-meeting-tab="agenda" role="tab" aria-selected="true" aria-controls="meeting-content">안건</button><button id="decisions-tab" data-meeting-tab="decisions" role="tab" aria-selected="false" aria-controls="meeting-content">결정사항</button><button id="records-tab" data-meeting-tab="records" role="tab" aria-selected="false" aria-controls="meeting-content">대화 기록</button></div><div id="meeting-content" role="tabpanel" aria-labelledby="agenda-tab"></div><div class="composer-note"><strong>읽기 전용 회의실</strong>이 화면에서 메시지가 전송되거나 AI가 응답하지는 않습니다. 기록에 없는 발언은 만들지 않습니다.</div></section></main></div>
<dialog id="detail"><header class="dialog-head"><h2 id="detail-title"></h2><p id="detail-role"></p><button class="close" id="close" aria-label="상세 닫기">×</button></header><div class="dialog-body" id="detail-body"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEAMS=[{id:'owner',name:'형님',role:'오너 · 최종 방향과 게시 승인'},{id:'chief',name:'총지휘',role:'작업 배분 · 검토 · 통합 판단'},{id:'codex',name:'Codex',role:'구현 · 테스트 · Studio 검증 / Sol·Luna 코딩'},{id:'claude',name:'Claude',role:'일반 구현 · UI / Sonnet·Haiku 작업'},{id:'opus',name:'Opus',role:'고난도 시스템 · 서버 권한 검토'},{id:'fable',name:'Fable',role:'독립 감사 · 고난도 검토'},{id:'studio',name:'Studio QA',role:'Desktop · Galaxy A06 검증 기록'}];
const STATUS={claimed:'클레임 기록',queued:'대기열 기록',review:'검토 대기',blocked:'차단 기록',done:'종료 기록',unknown:'배정 미확인'};
const blank=()=>({readOnly:true,mode:'locked',observedAt:null,issues:[],meetings:[]});
let data=blank(),space='office',meetingTab='agenda',selected=null,key=new URLSearchParams(location.hash.slice(1)).get('k')||'',epoch=0,controller=null,loading=false,error='',lastFocus=null,lastRecord='';
function stateOf(t){let l=t?.labels||[];if(t?.state==='closed'||l.includes('done'))return'done';if(l.includes('blocked'))return'blocked';if(l.some(v=>v.endsWith('-running')))return'claimed';if(l.some(v=>v.endsWith('-review')))return'review';if(l.some(v=>v.endsWith('-ready')))return'queued';return'unknown';}
function laneOf(t){let m=(t?.model||'').toLowerCase();if(m.includes('fable'))return'fable';if(m.includes('opus'))return'opus';if(m.includes('haiku'))return'claude';if(m.includes('luna'))return'codex';return ['claude','codex'].includes(t?.lane)?t.lane:null;}
function tasksOf(id){return data.issues.filter(t=>laneOf(t)===id);}
function duration(t){let a=Date.parse(t?.claimedAt),b=Date.parse(t?.claimEndedAt||data.observedAt);return Number.isFinite(a)&&Number.isFinite(b)&&b>=a?b-a:null;}
function elapsed(ms){if(ms===null||!Number.isFinite(ms)||ms<0)return'측정 안 됨';let m=Math.floor(ms/60000);return m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`;}
const date=v=>typeof v==='string'&&Number.isFinite(Date.parse(v))?new Date(v).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'기록 없음';
function validateData(v){if(v?.readOnly!==true||!Array.isArray(v.issues)||v.issues.length>500||typeof v.observedAt!=='string'||!Number.isFinite(Date.parse(v.observedAt)))throw Error('올바르지 않은 저장본입니다.');const text=(x,max=2000)=>typeof x==='string'&&x.length<=max;for(const t of v.issues){if(!t||!Number.isSafeInteger(t.number)||t.number<1||!text(t.title,1000)||!Array.isArray(t.labels)||t.labels.length>100||!t.labels.every(s=>text(s,100)))throw Error('잘못된 작업 기록입니다.');for(const p of ['model','branch','summary'])if(t[p]!=null&&!text(t[p],15000))throw Error('잘못된 작업 필드입니다.');if(t.pr!=null&&(!Number.isSafeInteger(t.pr)||t.pr<1))throw Error('잘못된 PR 번호입니다.');}
 const meetings=v.meetings??[];if(!Array.isArray(meetings)||meetings.length>50)throw Error('잘못된 회의 기록입니다.');for(const m of meetings){if(!m||!text(m.title,200)||!text(m.source,500)||!Array.isArray(m.agenda)||!Array.isArray(m.decisions)||!Array.isArray(m.messages)||m.agenda.length>30||m.decisions.length>30||m.messages.length>100)throw Error('잘못된 회의 형식입니다.');if(!m.agenda.every(x=>text(x,2000))||!m.decisions.every(x=>text(x,2000)))throw Error('잘못된 안건입니다.');for(const msg of m.messages){if(!msg||!['owner','chief','fable'].includes(msg.author)||!text(msg.body,5000)||!text(msg.source,500)||!['owner-request','implementation-note','agent-evidence'].includes(msg.kind)||(msg.author==='fable'&&msg.kind!=='agent-evidence'))throw Error('발언 출처를 확인할 수 없습니다.');}}
 return {...v,mode:'snapshot',meetings};}
function decode64(s){if(typeof s!=='string'||s.length>4000000||!/^[A-Za-z0-9_-]+$/.test(s))throw Error('올바르지 않은 암호화 기록입니다.');let a=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(a.padEnd(Math.ceil(a.length/4)*4,'=')),c=>c.charCodeAt(0));}
async function decryptRecord(rec,k){if(rec?.version!==1||rec.algorithm!=='AES-256-GCM')throw Error('지원하지 않는 저장본입니다.');let raw=decode64(k),iv=decode64(rec.iv);if(raw.length!==32||iv.length!==12)throw Error('개인 링크를 확인해주세요.');let ck=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},ck,decode64(rec.data));return validateData(JSON.parse(new TextDecoder().decode(plain)));}
function refresh(){for(const b of document.querySelectorAll('[data-room]')){let id=b.dataset.room,t=tasksOf(id)[0];if(['owner','chief','studio'].includes(id))continue;b.querySelector('small').textContent=data.mode==='locked'?'기록 잠김':t?STATUS[stateOf(t)]:'배정 미확인';}const age=data.observedAt&&Date.now()-Date.parse(data.observedAt)>900000;$('snapshot').textContent=data.mode==='locked'?'개인 오피스 · 기록 잠김':`${age?'과거 저장본':'저장본'} · ${date(data.observedAt)}`;renderMeeting();}
function meetingMarkup(tab){if(data.mode==='locked')return '<div class="empty">개인 링크로 열면 보호된 회의 기록을 볼 수 있습니다.</div>';if(!data.meetings.length)return '<div class="empty">아직 저장된 회의가 없습니다. 발언이나 결정사항을 임의로 표시하지 않습니다.</div>';let out='';for(const m of data.meetings){if(tab==='agenda'){out+='<article class="agenda"><span class="badge">요청 기록</span><h3>'+esc(m.title)+'</h3>'+m.agenda.map(a=>'<p>'+esc(a)+'</p>').join('')+'<div class="source-note">출처: '+esc(m.source)+'</div></article>';}
 else if(tab==='decisions'){out+='<p class="eyebrow">'+esc(m.title)+'</p>'+m.decisions.map((d,i)=>'<div class="decision"><b>'+String(i+1).padStart(2,'0')+'</b><div><p>'+esc(d)+'</p><small>'+esc(m.source)+'</small></div></div>').join('');}
 else{out+='<p class="source-note">실시간 채팅이 아닌 저장된 요청·운영 메모입니다.</p>'+m.messages.map(msg=>'<article class="log-message"><header>'+esc(TEAMS.find(t=>t.id===msg.author).name)+'<small>'+esc(msg.source)+'</small></header><p>'+esc(msg.body)+'</p></article>').join('');if(!m.messages.some(msg=>msg.author==='fable'))out+='<div class="empty">Fable의 회의 발언은 아직 기록되지 않았습니다.<br>참여자 이름은 역할 구성이지, 접속 중 표시가 아닙니다.</div>';}}
 return out;}
function renderMeeting(){document.querySelectorAll('[data-meeting-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.meetingTab===meetingTab)));$('meeting-content').setAttribute('aria-labelledby',meetingTab==='agenda'?'agenda-tab':meetingTab==='decisions'?'decisions-tab':'records-tab');$('meeting-content').innerHTML=meetingMarkup(meetingTab);}
function openSpace(next){space=next;for(const n of ['office','meeting']){$(n+'-panel').hidden=n!==space;$(n+'-tab').setAttribute('aria-selected',String(n===space));}window.scrollTo({top:0,behavior:'instant'});if(next==='meeting')renderMeeting();}
function issueLink(t){return '<a class="task-link" target="_blank" rel="noopener noreferrer" href="https://github.com/macchiatopsk-create/LastWall/issues/'+t.number+'">이슈 #'+t.number+' ↗</a>'+(t.pr?'<a class="task-link" target="_blank" rel="noopener noreferrer" href="https://github.com/macchiatopsk-create/LastWall/pull/'+t.pr+'">PR #'+t.pr+' ↗</a>':'');}
function showDialog(title,role,html){if(!$('detail').open)lastFocus=document.activeElement;$('detail-title').textContent=title;$('detail-role').textContent=role;$('detail-body').innerHTML=html;document.body.classList.add('modal-open');if(!$('detail').open)$('detail').showModal();$('detail-body').scrollTop=0;$('close').focus({preventScroll:true});}
function closeDialog(){if($('detail').open)$('detail').close();}
function personHTML(id,num){const ts=tasksOf(id),t=ts.find(x=>x.number===num)||ts[0];if(id==='owner')return '<p class="eyebrow">OWNER OFFICE</p><h3 class="task-title">중앙에서 팀 전체를 바라보는 집무실</h3><p class="muted">방향 결정과 최종 게시 승인은 형님에게 있습니다.</p><button class="task-link" id="open-meeting">회의실 · 승인된 요청 보기 ↗</button><p class="readonly">이 버튼은 기록을 엽니다. 작업 실행·승인·배포를 수행하지 않습니다.</p>';if(!t)return '<h3>확인된 실행 기록이 없습니다.</h3><p class="muted">'+(id==='chief'?'작업 배분·검토·통합을 맡는 자리입니다. 계속 실행 중인 프로세스를 나타내지 않습니다.':id==='studio'?'Studio의 실제 점유 신호는 연결되지 않았습니다.':'새 배정을 추측해서 표시하지 않습니다.')+'</p><button class="task-link" id="open-meeting">회의실 열기 ↗</button>';
 return '<span class="badge">'+STATUS[stateOf(t)]+'</span><h3 class="task-title">#'+t.number+' '+esc(t.title)+'</h3><p class="eyebrow">기록된 담당 구간</p><div class="timer">'+elapsed(duration(t))+'</div><p class="muted">클레임 → 해제·검토 또는 저장본 관측 시점</p><dl class="meta"><dt>시작 기록</dt><dd>'+date(t.claimedAt)+'</dd><dt>해제 / 검토</dt><dd>'+date(t.claimEndedAt)+'</dd><dt>모델 기록</dt><dd>'+esc(t.model||'미확인')+'</dd><dt>브랜치</dt><dd>'+esc(t.branch||'기록 없음')+'</dd><dt>실제 실행시간</dt><dd>측정 안 됨</dd><dt>Heartbeat</dt><dd>미연결</dd></dl>'+(t.summary?'<div class="divider"><h3>제출된 기록</h3><p class="detail-summary">'+esc(t.summary)+'</p></div>':'')+issueLink(t)+(ts.length>1?'<h3>이 팀의 다른 작업</h3>'+ts.map(x=>'<button class="task-link" data-task="'+x.number+'">#'+x.number+' '+esc(x.title)+'</button>').join(''):'')+'<p class="readonly">'+date(data.observedAt)+' 저장본입니다. 이 시간은 실제 코딩 시간이 아니며, 클레임 표시는 현재 실행 증거가 아닙니다.</p>';}
function bindDetail(){document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{let t=data.issues.find(t=>t.number===Number(b.dataset.task));if(t)showPerson(laneOf(t)||'chief',t.number);});if($('open-meeting'))$('open-meeting').onclick=()=>{closeDialog();openSpace('meeting');};}
function showPerson(id,num=null){const r=TEAMS.find(t=>t.id===id);if(!r)return;selected=id;showDialog(r.name,r.role,personHTML(id,num));bindDetail();}
function showConnection(){selected='connection';showDialog('기록 연결','조회 전용 · 자동 실행 없음','<dl class="meta"><dt>작업 관측</dt><dd>'+date(data.observedAt)+'</dd><dt>데이터</dt><dd>'+(data.mode==='locked'?'잠김':'암호화된 저장본')+'</dd><dt>러너 심박</dt><dd>미연결</dd><dt>AI 채팅</dt><dd>미연결 · 회의는 기록 열람만</dd></dl><p class="muted">'+esc(error||'기존 개인 링크를 그대로 사용할 수 있습니다.')+'</p><button class="task-link" id="reload">게시된 기록 다시 읽기 ↻</button><h3>작업 목록</h3>'+data.issues.map(t=>'<button class="task-link" data-task="'+t.number+'">#'+t.number+' '+esc(t.title)+'<small>'+STATUS[stateOf(t)]+'</small></button>').join('')+'<p class="readonly">개인 링크를 가진 사람은 기록을 볼 수 있습니다. 링크를 공유하지 마세요. 자동 수집·채팅·작업 명령은 연결되지 않았습니다.</p>');bindDetail();$('reload').onclick=()=>loadData(true);}
async function loadData(manual=false){if(loading)return;loading=true;const own=++epoch,c=new AbortController();controller=c;let timer=setTimeout(()=>c.abort(),10000);try{if(!key)throw Error('전달받은 개인 링크로 열면 기록이 표시됩니다.');let r=await fetch('./status.enc.json',{credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:c.signal});if(!r.ok)throw Error('저장본을 가져오지 못했습니다.');let text=await r.text();if(text.length>4000000)throw Error('저장본이 너무 큽니다.');let next=await decryptRecord(JSON.parse(text),key);if(own!==epoch)return;error='';if(lastRecord!==text){data=next;lastRecord=text;refresh();}if(manual&&selected==='connection')showConnection();}catch(e){if(own!==epoch)return;error=e.name==='AbortError'?'연결 시간이 초과되었습니다.':e.name==='OperationError'?'개인 기록을 열지 못했습니다. 링크를 확인해주세요.':e.message;if(manual&&selected==='connection')showConnection();}finally{clearTimeout(timer);if(own===epoch)loading=false;}}
function clearPrivate(){epoch++;controller?.abort();loading=false;data=blank();lastRecord='';error='';key=new URLSearchParams(location.hash.slice(1)).get('k')||'';closeDialog();$('detail-body').replaceChildren();refresh();loadData();}
function init(){document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>showPerson(b.dataset.room));$('office-tab').onclick=()=>openSpace('office');$('meeting-tab').onclick=()=>openSpace('meeting');$('meeting-room').onclick=()=>openSpace('meeting');document.querySelectorAll('[data-meeting-tab]').forEach(b=>b.onclick=()=>{meetingTab=b.dataset.meetingTab;renderMeeting();});for(const list of document.querySelectorAll('[role=tablist]'))list.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const buttons=[...list.querySelectorAll('[role=tab]')],i=buttons.indexOf(document.activeElement);if(i<0)return;e.preventDefault();let next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[next].focus();buttons[next].click();});$('connection').onclick=showConnection;$('close').onclick=closeDialog;$('detail').addEventListener('close',()=>{document.body.classList.remove('modal-open');lastFocus?.focus?.({preventScroll:true});});$('detail').addEventListener('click',e=>{if(e.target===$('detail')){let r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});$('art').addEventListener('error',()=>{$('scene').classList.add('failed');$('image-error').hidden=false;});$('art').addEventListener('load',()=>{$('scene').classList.remove('failed');$('image-error').hidden=true;});$('rooms-directory').innerHTML=TEAMS.map(t=>'<button data-fallback="'+t.id+'">'+t.name+'</button>').join('')+'<button data-fallback="meeting">회의실</button>';document.querySelectorAll('[data-fallback]').forEach(b=>b.onclick=()=>b.dataset.fallback==='meeting'?openSpace('meeting'):showPerson(b.dataset.fallback));window.addEventListener('hashchange',clearPrivate);const u=new URL(location.href);if(u.searchParams.has('wide')){u.searchParams.delete('wide');try{history.replaceState(null,'',u);}catch{}}refresh();loadData();setInterval(()=>{if(!document.hidden)loadData();},60000);}
window.HQOffice={version:'7.0-portrait-meeting',stateOf,laneOf,duration,elapsed,validateData,decryptRecord,meetingMarkup,TEAMS,getView:()=>({space,meetingTab,selected,locked:data.mode==='locked',observedAt:data.observedAt,meetings:data.meetings.length})};
init();
</script></body></html>
