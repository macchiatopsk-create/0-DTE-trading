<style>

:5px 9px;font-size:10px;margin-bottom:9px;color:#c4b4de}.current-task{font-size:17px;line-height:1.5;font-weight:650;margin:8px 0 0}.section{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}h3{font-size:12px;font-weight:600;margin:0 0 10px}.timer{font-size:29px;font-variant-numeric:tabular-nums;letter-spacing:1px;color:#ecd0a2;margin:8px 0}dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:11px 8px;font-size:11px;line-height:1.7;margin:14px 0}dt{color:var(--dim)}dd{margin:0;overflow-wrap:anywhere;color:#d4deda}.note{font-size:10px;color:#acbfc3;background:#8cadb309;border-left:2px solid #779897;padding:9px 11px;line-height:1.8}.task-row{display:block;background:#21364440;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:44px;width:100%;text-align:left;font-size:12px;line-height:1.5;color:var(--ink);text-decoration:none;margin:8px 0}.task-row small{display:block;margin-top:5px;color:var(--dim);font-size:10px}.action{width:100%;min-height:44px;padding:11px;border:1px solid #759da666;border-radius:11px;background:#2a52623d;color:#c6e3e4;font-size:12px}.scrim{display:none}.loader{position:absolute;inset:0;z-index:4;display:grid;place-content:center;text-align:center;background:#102332;padding:28px}.loader b{color:#dfc596;font-size:18px}.loader p{font-size:12px;line-height:1.8;color:#a7c0c6;max-width:300px}.loader .spinner{width:38px;height:38px;border:1px solid #a9c6c322;border-top-color:#dfc596;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}.fallback-team{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:320px}.fallback-team button{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:#203749}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#081720ed;border:1px solid #c7c1a24a;box-shadow:0 4px 30px #0005;border-radius:12px;padding:12px 15px;z-index:20;max-width:90vw;font-size:12px;width:max-content}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}footer{display:none}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.head-note{display:none}.brand b{font-size:16px}.brand small{font-size:9px}header{padding:8px 15px}#record{font-size:10px;padding:7px 9px}.edition{display:none}.scene-top{left:17px;right:17px;top:19px}.scene-top h1{font-size:19px}.scene-top p{font-size:10px}.scene-top .eyebrow{font-size:8px}.toolbar{right:10px;top:98px;gap:4px}.tool{height:40px;width:40px;font-size:19px;min-height:44px}.desk-tag{min-width:95px;max-width:125px;padding:6px 8px}.desk-tag strong{font-size:11px}.desk-tag small{font-size:8px}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;max-height:68dvh;border-left:0;border-top:1px solid #667f8977;border-radius:23px 23px 0 0;z-index:12;box-shadow:0 -16px 80px #08111daa;padding-bottom:env(safe-area-inset-bottom)}.detail-head{padding:23px 19px 0}.detail-head:before{content:"";position:absolute;top:8px;left:calc(50% - 16px);width:32px;height:3px;background:#5e777f;border-radius:5px}.detail-tabs{margin-top:9px}.scrim:not([hidden]){display:block;position:fixed;inset:0;background:#08182240;z-index:11}h2{font-size:21px}.floor-info small{max-width:120px;text-align:right}#stage{inset:76px 0 91px}nav{gap:0;justify-content:space-around}nav button{min-width:60px}.team-rail{bottom:12px}.floor-info{bottom:58px}.app{grid-template-rows:64px minmax(0,1fr) 64px}}@media(max-height:510px) and (orientation:landscape){.app{grid-template-rows:49px minmax(0,1fr) 48px}.scene-top{top:9px}.scene-top h1{font-size:15px}.scene-top p,.scene-top .eyebrow{display:none}#stage{inset:36px 0 57px}.floor-info{display:none}.toolbar{top:40px;flex-direction:row}.tool{width:38px}.team-rail{bottom:5px}.sidebar{max-height:90dvh}.detail-head{padding-top:20px}.brand small{display:none}nav button svg{height:16px}nav button{min-height:40px}.team-rail button{min-height:36px}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}

/* Nameplates sit on the cubicles; the office is not a grid of dashboard cards. */
.desk-tag{background:transparent;border:0;box-shadow:none;backdrop-filter:none;padding:0;display:flex;align-items:center;justify-content:center;min-width:94px;min-height:44px;max-width:150px}.desk-tag .placard{display:block;padding:6px 10px;background:#0e1b23ec;border:1px solid #b6a78260;border-radius:6px;box-shadow:0 4px 12px #0005;white-space:nowrap}.desk-tag small{display:none}.desk-tag.selected{border:0;box-shadow:none}.desk-tag.selected .placard{border-color:#91d5e0;box-shadow:0 0 10px #72c5d638}.detail-tabs button{background:none;border:0;color:inherit;font-size:11px;min-height:36px;padding:7px 3px}.detail-tabs button.on{color:#e4d7ba;border-bottom:2px solid var(--gold)}
@media(max-width:900px){.toolbar{top:auto;bottom:95px;left:50%;right:auto;transform:translateX(-50%);flex-direction:row;padding:4px;border:1px solid #acbbad20;border-radius:16px;background:#0a1b27b5;gap:3px}.tool{border:0;background:none;width:40px;min-height:44px}.desk-tag{min-width:86px}.desk-tag .placard{padding:5px 7px}.desk-tag strong{font-size:10px}.detail-tabs button{min-height:44px}}
@media(max-height:510px) and (orientation:landscape){.toolbar{top:40px;bottom:auto;left:auto;right:8px;transform:none;flex-direction:row;gap:0}.tool{width:34px}.desk-tag .placard{padding:4px 6px}.desk-tag strong{font-size:9px}}
@media (max-height:510px) and (orientation:landscape){#stage{inset:22px 0 46px}.scene-top h1{font-size:12px}.scene-top{top:6px}.desk-tag{min-width:58px}.desk-tag small{display:none}.toolbar{top:32px;bottom:auto;left:auto;right:7px;transform:none;flex-direction:column}.tool{width:33px;height:33px;min-height:33px;font-size:16px}.toolbar #plus,.toolbar #minus{display:none}.team-rail{right:48px}.team-rail button{min-height:38px}.floor-info{display:none}}

</head><body>
<div class="app" id="app"><header><div class="brand"><div class="mark" aria-hidden="true"><i></i><i></i><i></i></div><div><b>Last Wall <span>HQ</span></b><small>PRIVATE OFFICE · 3D EDITION</small></div></div><div class="head-note">하나의 팀, 하나의 세계.<br><em>Build something worth defending.</em></div><button id="record" aria-label="개인 기록 연결 상태">개인 기록 확인 중 ↗</button></header>
<main class="main"><section class="office-area" aria-label="입체 오피스"><div class="scene-top"><div><div class="eyebrow">THE TEAM BEHIND THE WALL</div><h1>함께 만드는 더 큰 세계</h1><p id="overview">사무실의 직원이나 책상을 터치해보세요.</p></div><div class="edition">3D OFFICE / 04</div></div>
<div id="stage"><canvas id="office" aria-label="직원과 책상을 선택하는 입체 사무실"></canvas><div id="people"></div><div class="loader" id="loader" role="status"><div class="spinner"></div><b>사무실 문 여는 중</b><p>책상, 조명, 팀원들을 준비하고 있습니다.</p></div></div>
<div class="toolbar"><button class="tool" id="home" aria-label="사무실 전체 보기" title="전체 보기">⌂</button><button class="tool" id="rotate" aria-label="사무실 시점 바꾸기" title="시점 바꾸기">⟳</button><button class="tool" id="plus" aria-label="확대">＋</button><button class="tool" id="minus" aria-label="축소">−</button><button class="tool" id="light" aria-label="조명 전환" aria-pressed="false" title="조명 전환">☾</button></div>
<div class="floor-info"><span><b>01F · LAST WALL STUDIO</b><br><span id="snapshot-note">저장된 작업 기록 · 실행 신호 미연결</span></span><small>드래그로 이동<br>두 손가락으로 확대</small></div><div class="team-rail" id="team-rail" aria-label="팀원 바로 선택"></div></section>
<aside class="sidebar" id="sidebar" hidden aria-label="직원 작업 상세"><div class="detail-head"><div id="person-head"></div><button id="close" aria-label="상세 닫기">×</button><div class="detail-tabs"><button data-dtab="overview" class="on">개요</button><button data-dtab="tasks">작업 기록</button><button data-dtab="connection">연결 정보</button></div></div><div id="detail"></div></aside></main>
<nav aria-label="주 메뉴"><button class="active" data-nav="office"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11H3Z M9 21v-8h6v8"/></svg>사무실</button><button data-nav="team"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-5a6 6 0 0 1 12 0v5M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5v2"/></svg>우리 팀</button><button data-nav="tasks"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v4H9zM9 11h6M9 16h6"/></svg>작업 기록</button><button data-nav="connection"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 3 6M4 4v8h8M12 7v5l3 2"/></svg>새로고침</button></nav></div><div class="scrim" id="scrim" hidden></div><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEAMS=[{id:'owner',name:'형님',initial:'♛',role:'오너 · 최종 방향과 게시 승인'},{id:'chief',name:'총지휘',initial:'HQ',role:'작업 배분 · 코드 검토 · 통합 판단'},{id:'codex',name:'Codex',initial:'C',role:'코딩 · 테스트 · Studio 실제 검증'},{id:'claude',name:'Claude 팀',initial:'S',role:'Sonnet 중심 구현 · 실제 모델은 기록으로 확인'},{id:'opus',name:'Opus',initial:'O',role:'고난도 시스템 · 서버 권한 검토'},{id:'fable',name:'Fable',initial:'F',role:'독립 감사 · 어려운 검토'},{id:'lightweight',name:'Haiku / Luna',initial:'H',role:'가벼운 구현 · 반복 작업 · 테스트 보강'},{id:'studio',name:'Studio QA',initial:'QA',role:'데스크톱 · Galaxy A06 검증 기록'}];
const STATUSES={review:['검토 대기','#c5b6e4'],claimed:['클레임 · 실행 미확인','#9dc3df'],queued:['대기열','#dcbf8b'],blocked:['차단 기록','#dc9a86'],done:['종료 기록','#9fc8b1'],unknown:['배정 미확인','#9fada8'],manual:['지휘 · 승인','#ddc38e']};
const empty=()=>({readOnly:true,mode:'locked',observedAt:null,issues:[],runners:[],studio:{owner:null}});
let data=empty(),selected='chief',selectedTask=null,mode=null,officeRenderer=null,lastFocus=null,keyText=new URLSearchParams(location.hash.slice(1)).get('k')||'',loading=false,connectionError='',requestEpoch=0,aborter=null;
function stateOf(t){let ls=t?.labels||[];if(t?.state==='closed'||ls.includes('done'))return'done';if(ls.includes('blocked'))return'blocked';if(ls.some(x=>x.endsWith('-running')))return'claimed';if(ls.some(x=>x.endsWith('-review')))return'review';if(ls.some(x=>x.endsWith('-ready')))return'queued';return'unknown';}
function laneOf(t){let m=(t?.model||'').toLowerCase();if(m.includes('fable'))return'fable';if(m.includes('opus'))return'opus';if(m.includes('haiku')||m.includes('luna'))return'lightweight';return t?.lane==='codex'?'codex':t?.lane==='claude'?'claude':null;}
function tasksOf(id){return data.issues.filter(t=>laneOf(t)===id);}
function seatState(id){if(['owner','chief'].includes(id))return'manual';let ts=tasksOf(id);return ts.length?stateOf(ts[0]):'unknown';}
function duration(t){const a=Date.parse(t?.claimedAt),b=Date.parse(t?.claimEndedAt||data.observedAt);return Number.isFinite(a)&&Number.isFinite(b)&&b>=a?b-a:null;}
function elapsed(ms){if(ms===null||!Number.isFinite(ms)||ms<0)return'측정 안 됨';let s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');}
function date(v){return v&&Number.isFinite(Date.parse(v))?new Date(v).toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'기록 없음';}
function updateLabels(){for(let [i,r]of TEAMS.entries()){let t=tasksOf(r.id)[0],st=STATUSES[seatState(r.id)],b=document.querySelector('.desk-tag[data-seat="'+i+'"]');if(!b)continue;b.innerHTML='<span class="placard"><strong><i class="led" style="background:'+st[1]+'"></i>'+esc(r.name)+'</strong><small>'+esc(t?'#'+t.number+' · '+st[0]:r.id==='studio'?'점유 미확인':st[0])+'</small></span>';b.classList.toggle('selected',selected===r.id&&mode==='person');}document.querySelectorAll('[data-team]').forEach(b=>b.classList.toggle('active',b.dataset.team===selected&&mode==='person'));}
function initLabels(){for(let [i,r]of TEAMS.entries()){let b=document.createElement('button');b.className='desk-tag';b.dataset.seat=i;b.setAttribute('aria-label',r.name+' 작업 상세');b.onclick=()=>showPerson(r.id);$('people').append(b);let c=document.createElement('button');c.dataset.team=r.id;c.textContent=r.name;c.onclick=()=>showPerson(r.id);$('team-rail').append(c);}updateLabels();}
function projectLabels(points){for(let [i,p]of points.entries()){let b=document.querySelector('.desk-tag[data-seat="'+i+'"]');if(!b)continue;b.style.left=p.x+'px';b.style.top=p.y+'px';b.hidden=!p.visible;}}
