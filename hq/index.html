const TEAMS=[{id:'owner',name:'형님',role:'오너 · 최종 방향과 게시 승인'},{id:'chief',name:'총지휘',role:'작업 배분 · 검토 · 통합 판단'},{id:'codex',name:'Codex',role:'구현 · 테스트 · Studio 검증 / Sol·Luna 코딩'},{id:'claude',name:'Claude',role:'일반 구현 · UI / Sonnet·Haiku 작업'},{id:'opus',name:'Opus',role:'고난도 시스템 · 서버 권한 검토'},{id:'fable',name:'Fable',role:'독립 감사 · 고난도 검토'},{id:'studio',name:'Studio QA',role:'Desktop · Galaxy A06 검증 기록'},{id:'astra',name:'Astra',role:'코딩 리뷰 · 검토 / 독립 에이전트 연결 미확인'}];
const STATUS={claimed:'클레임 기록',queued:'대기열 기록',review:'검토 대기',blocked:'차단 기록',done:'종료 기록',unknown:'배정 미확인'};
const blank=()=>({readOnly:true,mode:'locked',observedAt:null,issues:[],meetings:[]});
let data=blank(),space='office',meetingTab='agenda',selected=null,key=new URLSearchParams(location.hash.slice(1)).get('k')||'',epoch=0,controller=null,loading=false,error='',lastFocus=null,lastRecord='';
function stateOf(t){let l=t?.labels||[];if(t?.state==='closed'||l.includes('done'))return'done';if(l.includes('blocked'))return'blocked';if(l.some(v=>v.endsWith('-running')))return'claimed';if(l.some(v=>v.endsWith('-review')))return'review';if(l.some(v=>v.endsWith('-ready')))return'queued';return'unknown';}
function laneOf(t){let m=(t?.model||'').toLowerCase();if(m.includes('astra'))return'astra';if(m.includes('fable'))return'fable';if(m.includes('opus'))return'opus';if(m.includes('haiku'))return'claude';if(m.includes('luna'))return'codex';return ['claude','codex','astra'].includes(t?.lane)?t.lane:null;}
function tasksOf(id){return data.issues.filter(t=>laneOf(t)===id);}
function duration(t){let a=Date.parse(t?.claimedAt),b=Date.parse(t?.claimEndedAt||data.observedAt);return Number.isFinite(a)&&Number.isFinite(b)&&b>=a?b-a:null;}
function elapsed(ms){if(ms===null||!Number.isFinite(ms)||ms<0)return'측정 안 됨';let m=Math.floor(ms/60000);return m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`;}
const date=v=>typeof v==='string'&&Number.isFinite(Date.parse(v))?new Date(v).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'기록 없음';
function validateData(v){if(v?.readOnly!==true||!Array.isArray(v.issues)||v.issues.length>500||typeof v.observedAt!=='string'||!Number.isFinite(Date.parse(v.observedAt)))throw Error('올바르지 않은 저장본입니다.');const text=(x,max=2000)=>typeof x==='string'&&x.length<=max;for(const t of v.issues){if(!t||!Number.isSafeInteger(t.number)||t.number<1||!text(t.title,1000)||!Array.isArray(t.labels)||t.labels.length>100||!t.labels.every(s=>text(s,100)))throw Error('잘못된 작업 기록입니다.');for(const p of ['model','branch','summary'])if(t[p]!=null&&!text(t[p],15000))throw Error('잘못된 작업 필드입니다.');if(t.pr!=null&&(!Number.isSafeInteger(t.pr)||t.pr<1))throw Error('잘못된 PR 번호입니다.');}
 const meetings=v.meetings??[];if(!Array.isArray(meetings)||meetings.length>50)throw Error('잘못된 회의 기록입니다.');for(const m of meetings){if(!m||!text(m.title,200)||!text(m.source,500)||!Array.isArray(m.agenda)||!Array.isArray(m.decisions)||!Array.isArray(m.messages)||m.agenda.length>30||m.decisions.length>30||m.messages.length>100)throw Error('잘못된 회의 형식입니다.');if(!m.agenda.every(x=>text(x,2000))||!m.decisions.every(x=>text(x,2000)))throw Error('잘못된 안건입니다.');for(const msg of m.messages){if(!msg||!['owner','chief','fable','codex','astra'].includes(msg.author)||!text(msg.body,5000)||!text(msg.source,500)||!['owner-request','implementation-note','agent-evidence'].includes(msg.kind)||(['fable','codex','astra'].includes(msg.author)&&msg.kind!=='agent-evidence'))throw Error('발언 출처를 확인할 수 없습니다.');}}
 return {...v,mode:'snapshot',meetings};}
function decode64(s){if(typeof s!=='string'||s.length>4000000||!/^[A-Za-z0-9_-]+$/.test(s))throw Error('올바르지 않은 암호화 기록입니다.');let a=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(a.padEnd(Math.ceil(a.length/4)*4,'=')),c=>c.charCodeAt(0));}
async function decryptRecord(rec,k){if(rec?.version!==1||rec.algorithm!=='AES-256-GCM')throw Error('지원하지 않는 저장본입니다.');let raw=decode64(k),iv=decode64(rec.iv);if(raw.length!==32||iv.length!==12)throw Error('개인 링크를 확인해주세요.');let ck=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},ck,decode64(rec.data));return validateData(JSON.parse(new TextDecoder().decode(plain)));}
function refresh(){for(const b of document.querySelectorAll('[data-room]')){let id=b.dataset.room,t=tasksOf(id)[0];if(['owner','chief','studio'].includes(id))continue;b.querySelector('small').textContent=data.mode==='locked'?'기록 잠김':t?STATUS[stateOf(t)]:'배정 미확인';}const age=data.observedAt&&Date.now()-Date.parse(data.observedAt)>900000;$('snapshot').textContent=data.mode==='locked'?'개인 오피스 · 기록 잠김':`${age?'과거 저장본':'저장본'} · ${date(data.observedAt)}`;renderMeeting();}
function meetingMarkup(tab){if(data.mode==='locked')return '<div class="empty">개인 링크로 열면 보호된 회의 기록을 볼 수 있습니다.</div>';if(!data.meetings.length)return '<div class="empty">아직 저장된 회의가 없습니다. 발언이나 결정사항을 임의로 표시하지 않습니다.</div>';let out='';for(const m of data.meetings){if(tab==='agenda'){out+='<article class="agenda"><span class="badge">요청 기록</span><h3>'+esc(m.title)+'</h3>'+m.agenda.map(a=>'<p>'+esc(a)+'</p>').join('')+'<div class="source-note">출처: '+esc(m.source)+'</div></article>';}
 else if(tab==='decisions'){out+='<p class="eyebrow">'+esc(m.title)+'</p>'+m.decisions.map((d,i)=>'<div class="decision"><b>'+String(i+1).padStart(2,'0')+'</b><div><p>'+esc(d)+'</p><small>'+esc(m.source)+'</small></div></div>').join('');}
 else{out+='<p class="source-note">실시간 채팅이 아닌 저장된 요청·운영 메모입니다.</p>'+m.messages.map(msg=>'<article class="log-message"><header>'+esc(TEAMS.find(t=>t.id===msg.author).name)+'<small>'+esc(msg.source)+'</small></header><p>'+esc(msg.body)+'</p></article>').join('');for(const id of ['fable','astra'])if(!m.messages.some(msg=>msg.author===id))out+='<div class="empty">'+(id==='fable'?'Fable':'Astra')+'의 회의 발언은 아직 기록되지 않았습니다. 접속 중 표시는 아닙니다.</div>';}}
 return out;}
function renderMeeting(){document.querySelectorAll('[data-meeting-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.meetingTab===meetingTab)));$('meeting-content').setAttribute('aria-labelledby',meetingTab==='agenda'?'agenda-tab':meetingTab==='decisions'?'decisions-tab':'records-tab');$('meeting-content').innerHTML=meetingMarkup(meetingTab);}
function openSpace(next){space=next;for(const n of ['office','meeting']){$(n+'-panel').hidden=n!==space;$(n+'-tab').setAttribute('aria-selected',String(n===space));}window.scrollTo({top:0,behavior:'instant'});if(next==='meeting')renderMeeting();}
function issueLink(t){return '<a class="task-link" target="_blank" rel="noopener noreferrer" href="https://github.com/macchiatopsk-create/LastWall/issues/'+t.number+'">이슈 #'+t.number+' ↗</a>'+(t.pr?'<a class="task-link" target="_blank" rel="noopener noreferrer" href="https://github.com/macchiatopsk-create/LastWall/pull/'+t.pr+'">PR #'+t.pr+' ↗</a>':'');}
function showDialog(title,role,html){if(!$('detail').open)lastFocus=document.activeElement;$('detail-title').textContent=title;$('detail-role').textContent=role;$('detail-body').innerHTML=html;document.body.classList.add('modal-open');if(!$('detail').open)$('detail').showModal();$('detail-body').scrollTop=0;$('close').focus({preventScroll:true});}
function closeDialog(){if($('detail').open)$('detail').close();}
function personHTML(id,num){const r=TEAMS.find(t=>t.id===id),ts=tasksOf(id),t=ts.find(x=>x.number===num)||ts[0];const status=t?STATUS[stateOf(t)]:id==='owner'?'최종 결정 · 승인':id==='chief'?'지휘 역할 · 상시 실행 아님':id==='astra'?'별도 모델 연결 미확인':'확인된 실행 기록 없음';return '<span class="badge">'+status+'</span><p class="eyebrow">현재 작업</p><h3 class="task-title">'+esc(t?'#'+t.number+' '+t.title:id==='owner'?'방향 결정 · 최종 게시 승인':id==='chief'?'작업 배분 · 검토 · 통합':'배정된 작업 기록 없음')+'</h3><dl class="meta"><dt>담당 역할</dt><dd>'+esc(r.role)+'</dd><dt>작업 상태</dt><dd>'+status+'</dd><dt>실제 작업시간</dt><dd>측정 안 됨</dd><dt>기록된 담당 구간</dt><dd>'+elapsed(duration(t))+'</dd><dt>시작 기록</dt><dd>'+date(t?.claimedAt)+'</dd><dt>해제 / 검토</dt><dd>'+date(t?.claimEndedAt)+'</dd><dt>모델 기록</dt><dd>'+esc(t?.model||'미확인')+'</dd><dt>Heartbeat</dt><dd>미연결</dd></dl>'+progressHTML(t)+(t?.branch?'<dl class="meta"><dt>브랜치</dt><dd>'+esc(t.branch)+'</dd></dl>':'')+(t?.summary?'<div class="divider"><h3>최근 제출 기록</h3><p class="detail-summary">'+esc(t.summary)+'</p></div>':'')+(t?issueLink(t):'')+(ts.length>1?'<h3>이 팀의 다른 작업</h3>'+ts.map(x=>'<button class="task-link" data-task="'+x.number+'">#'+x.number+' '+esc(x.title)+'</button>').join(''):'')+'<button class="task-link" id="open-meeting">우리 5명 회의실 ↗</button><p class="readonly">'+date(data.observedAt)+' 저장본 기준입니다. 담당 구간은 실제 코딩 시간이 아니며, 좌석과 아바타는 접속·실행 증거가 아닙니다. 기록에 없는 시간·진행률은 만들지 않습니다.</p>';}
function bindDetail(){document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{let t=data.issues.find(t=>t.number===Number(b.dataset.task));if(t)showPerson(laneOf(t)||'chief',t.number);});if($('open-meeting'))$('open-meeting').onclick=()=>{closeDialog();openSpace('meeting');};}
function showPerson(id,num=null){const r=TEAMS.find(t=>t.id===id);if(!r)return;selected=id;showDialog(r.name,r.role,personHTML(id,num));bindDetail();}
function showConnection(){selected='connection';showDialog('기록 연결','조회 전용 · 자동 실행 없음','<dl class="meta"><dt>작업 관측</dt><dd>'+date(data.observedAt)+'</dd><dt>데이터</dt><dd>'+(data.mode==='locked'?'잠김':'암호화된 저장본')+'</dd><dt>러너 심박</dt><dd>미연결</dd><dt>AI 채팅</dt><dd>미연결 · 회의는 기록 열람만</dd></dl><p class="muted">'+esc(error||'기존 개인 링크를 그대로 사용할 수 있습니다.')+'</p><button class="task-link" id="reload">게시된 기록 다시 읽기 ↻</button><h3>작업 목록</h3>'+data.issues.map(t=>'<button class="task-link" data-task="'+t.number+'">#'+t.number+' '+esc(t.title)+'<small>'+STATUS[stateOf(t)]+'</small></button>').join('')+'<p class="readonly">개인 링크를 가진 사람은 기록을 볼 수 있습니다. 링크를 공유하지 마세요. 자동 수집·채팅·작업 명령은 연결되지 않았습니다.</p>');bindDetail();$('reload').onclick=()=>loadData(true);}
async function loadData(manual=false){if(loading)return;loading=true;const own=++epoch,c=new AbortController();controller=c;let timer=setTimeout(()=>c.abort(),10000);try{if(!key)throw Error('전달받은 개인 링크로 열면 기록이 표시됩니다.');let r=await fetch('./status.enc.json',{credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:c.signal});if(!r.ok)throw Error('저장본을 가져오지 못했습니다.');let text=await r.text();if(text.length>4000000)throw Error('저장본이 너무 큽니다.');let next=await decryptRecord(JSON.parse(text),key);if(own!==epoch)return;error='';if(lastRecord!==text){data=next;lastRecord=text;refresh();}if(manual&&selected==='connection')showConnection();}catch(e){if(own!==epoch)return;error=e.name==='AbortError'?'연결 시간이 초과되었습니다.':e.name==='OperationError'?'개인 기록을 열지 못했습니다. 링크를 확인해주세요.':e.message;if(manual&&selected==='connection')showConnection();}finally{clearTimeout(timer);if(own===epoch)loading=false;}}
function clearPrivate(){epoch++;controller?.abort();loading=false;data=blank();lastRecord='';error='';key=new URLSearchParams(location.hash.slice(1)).get('k')||'';closeDialog();$('detail-body').replaceChildren();refresh();loadData();}

const MEETING_MEMBERS=['owner','astra','fable','codex','chief'];
const PALETTES={owner:['#d4b16d','#534833'],chief:['#91aeba','#334950'],codex:['#8cb4d1','#2f445a'],astra:['#b9b3dc','#484763'],fable:['#b6c8b4','#43564c'],claude:['#c4a49c','#62443f'],opus:['#9f99bd','#48405f'],studio:['#9bbaa9','#3b5349']};
function avatar(id,scope){const c=PALETTES[id]||PALETTES.chief,k='av-'+scope+'-'+id;return `<svg class="agent-avatar" viewBox="0 0 130 150" aria-hidden="true" focusable="false"><defs><linearGradient id="${k}" x2="0.7" y2="1"><stop stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><ellipse cx="65" cy="141" rx="45" ry="8" fill="#090f1680"/><rect x="21" y="63" width="88" height="70" rx="23" fill="#17252a" stroke="#756348" stroke-width="2"/><rect x="32" y="70" width="66" height="63" rx="21" fill="#283739"/><path d="M38 96Q65 74 92 96L100 134H30Z" fill="url(#${k})"/><rect x="56" y="76" width="18" height="19" rx="6" fill="${c[0]}"/><rect x="31" y="24" width="68" height="59" rx="24" fill="url(#${k})" stroke="#dfd5b06b" stroke-width="1.5"/><rect x="27" y="46" width="9" height="20" rx="4" fill="${c[1]}"/><rect x="94" y="46" width="9" height="20" rx="4" fill="${c[1]}"/><rect x="39" y="44" width="52" height="25" rx="10" fill="#102431"/><path d="M47 52H55M75 52H83" stroke="#d8eaf0" stroke-width="4" stroke-linecap="round"/><path d="M60 64H70" stroke="${c[0]}" stroke-width="2" stroke-linecap="round"/><path d="M43 95L24 119L36 127L55 104M87 95L105 119L94 127L76 104" fill="${c[1]}" stroke="${c[0]}" stroke-width="2"/><path d="M17 125H113L106 140H24Z" fill="#352c23" stroke="#a07f53"/><path d="M43 114H88L93 134H38Z" fill="#263841" stroke="#667f83"/><circle cx="65" cy="124" r="3" fill="${c[0]}"/>${id==='owner'?'<path d="M47 24L43 11L56 17L65 6L74 17L87 11L83 24Z" fill="#edd493" stroke="#926e39"/>':''}</svg>`;}
function installAvatars(){document.querySelectorAll('[data-room]').forEach(b=>{b.insertAdjacentHTML('beforeend',avatar(b.dataset.room,'office'));b.setAttribute('aria-label',TEAMS.find(t=>t.id===b.dataset.room).name+' · 작업 상세');});$('meeting-seats').innerHTML=MEETING_MEMBERS.map(id=>{const r=TEAMS.find(t=>t.id===id);return '<button class="meeting-seat" data-seat="'+id+'" aria-label="'+r.name+' · 담당과 작업 상세"><span class="seat-name">'+(id==='owner'?'♛ ':'')+r.name+'</span>'+avatar(id,'meeting')+'</button>';}).join('');document.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>showPerson(b.dataset.seat));}
function progressOf(t){const p=t?.progress;if(p&&typeof p==='object'&&!Array.isArray(p)&&typeof p.source==='string'&&p.source.trim()){if(Number.isInteger(p.completed)&&Number.isInteger(p.total)&&p.total>0&&p.total<=10000&&p.completed>=0&&p.completed<=p.total)return{value:Math.round(p.completed/p.total*100),label:'체크리스트 '+p.completed+'/'+p.total+' 완료',source:p.source};if(Number.isFinite(p.percent)&&p.percent>=0&&p.percent<=100)return{value:p.percent,label:'기록된 진행률 '+p.percent+'%',source:p.source};}return{value:null,label:'진행률 미기록',source:''};}
function progressHTML(t){const p=progressOf(t);return '<div class="progress-line"><span>작업 진행률</span><strong>'+esc(p.value===null?'미기록':p.value+'%')+'</strong></div>'+(p.value===null?'<p class="muted">진행률 또는 완료 체크리스트가 기록되지 않았습니다.</p>':'<div class="progress-track" role="progressbar" aria-label="'+esc(p.label)+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p.value+'"><i style="width:'+p.value+'%"></i></div><p class="muted">'+esc(p.label)+' · 출처: '+esc(p.source)+'</p>');}

function init(){installAvatars();document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>showPerson(b.dataset.room));$('office-tab').onclick=()=>openSpace('office');$('meeting-tab').onclick=()=>openSpace('meeting');$('meeting-room').onclick=()=>openSpace('meeting');document.querySelectorAll('[data-meeting-tab]').forEach(b=>b.onclick=()=>{meetingTab=b.dataset.meetingTab;renderMeeting();});for(const list of document.querySelectorAll('[role=tablist]'))list.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const buttons=[...list.querySelectorAll('[role=tab]')],i=buttons.indexOf(document.activeElement);if(i<0)return;e.preventDefault();let next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[next].focus();buttons[next].click();});$('connection').onclick=showConnection;$('close').onclick=closeDialog;$('detail').addEventListener('close',()=>{document.body.classList.remove('modal-open');lastFocus?.focus?.({preventScroll:true});});$('detail').addEventListener('click',e=>{if(e.target===$('detail')){let r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});$('art').addEventListener('error',()=>{$('scene').classList.add('failed');$('image-error').hidden=false;});$('art').addEventListener('load',()=>{$('scene').classList.remove('failed');$('image-error').hidden=true;});$('rooms-directory').innerHTML=TEAMS.map(t=>'<button data-fallback="'+t.id+'">'+t.name+'</button>').join('')+'<button data-fallback="meeting">회의실</button>';document.querySelectorAll('[data-fallback]').forEach(b=>b.onclick=()=>b.dataset.fallback==='meeting'?openSpace('meeting'):showPerson(b.dataset.fallback));window.addEventListener('hashchange',clearPrivate);const u=new URL(location.href);if(u.searchParams.has('wide')){u.searchParams.delete('wide');try{history.replaceState(null,'',u);}catch{}}refresh();loadData();setInterval(()=>{if(!document.hidden)loadData();},60000);}
window.HQOffice={version:'8.0-five-seat-office',stateOf,laneOf,duration,elapsed,validateData,decryptRecord,meetingMarkup,progressOf,MEETING_MEMBERS,TEAMS,getView:()=>({space,meetingTab,selected,locked:data.mode==='locked',observedAt:data.observedAt,meetings:data.meetings.length})};
init();
</script></body></html>
