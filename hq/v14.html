x;background:#ffffff25;margin:0 auto 12px}.head{display:flex;align-items:center;gap:10px}.head h2{margin:0;font-size:24px}.close{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid #ffffff16;background:#112632}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.box{border:1px solid #ffffff12;background:#ffffff05;border-radius:14px;padding:12px}.box.w{grid-column:1/-1}.box label{display:block;color:#90a1aa;font-size:10px;margin-bottom:6px}.box b{font-size:14px}.bottom{position:sticky;bottom:0;z-index:18;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#050c12f4;border-top:1px solid #ffffff14}.nav{min-height:58px;border:0;border-radius:13px;background:transparent;color:#94a3ad}.nav.active{background:#112b3b;color:#ffe0a7}.nav span{display:block;font-size:21px}.nav small{font-size:10px}@media(max-width:380px){.stage,.hero{min-height:680px}.chip{padding:6px 8px}.chip strong{font-size:11px}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="icon">▥</div><div><h1>Last Wall HQ</h1><div class="sub">PROJECT COMMAND CENTER</div></div></div><div class="tabs"><button class="tab active" data-tab="office">⌂ 사무실</button><button class="tab" data-tab="meeting">◎ 회의실</button></div></header><main><section id="office" class="screen active"><div class="stage"><img class="hero" src="./office-v13.webp?v=14" alt="Last Wall HQ 사무실" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(#0b1218,#182531)'"><button class="chip" id="owner" data-person="owner"><i class="dot"></i><span><strong>♛ 형님</strong><small>총괄</small></span></button><button class="chip review" id="codex" data-person="codex"><i class="dot"></i><span><strong>Codex</strong><small>검토 대기</small></span></button><button class="chip" id="fable" data-person="fable"><i class="dot"></i><span><strong>Fable</strong><small>대기</small></span></button><button class="chip" id="claude" data-person="claude"><i class="dot"></i><span><strong>Claude</strong><small>대기</small></span></button><button class="chip" id="studio" data-person="studio"><i class="dot"></i><span><strong>Studio QA</strong><small>대기</small></span></button><button class="chip" id="opus" data-person="opus"><i class="dot"></i><span><strong>Opus</strong><small>대기</small></span></button><div class="summary"><span><i class="dot" style="background:var(--green)"></i>작업중 0</span><span><i class="dot" style="background:var(--yellow)"></i>클레임 0</span><span><i class="dot" style="background:var(--purple)"></i>검토 1</span><span><i class="dot"></i>대기 4</span></div></div></section><section id="meeting" class="screen"><div class="stage"><img class="hero" src="./meeting-v13.webp?v=14" alt="Last Wall HQ 회의실" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(#0b1218,#182531)'"><button class="chip mowner" data-person="owner"><i class="dot"></i><span><strong>♛ 형님</strong><small>상석</small></span></button><button class="chip mastra" data-person="astra"><i class="dot"></i><span><strong>Astra</strong><small>미연결</small></span></button><button class="chip review mcodex" data-person="codex"><i class="dot"></i><span><strong>Codex</strong><small>검토 대기</small></span></button><button class="chip mfable" data-person="fable"><i class="dot"></i><span><strong>Fable</strong><small>대기</small></span></button><button class="chip mchief" data-person="chief"><i class="dot"></i><span><strong>총지휘</strong><small>대기</small></span></button><div class="chat"><div><b>회의실 대화</b><small>AI 브리지 연결 대기</small></div><button>›</button></div></div></section></main><nav class="bottom"><button class="nav active" data-tab="office"><span>⌂</span><small>사무실</small></button><button class="nav" data-tab="meeting"><span>◎</span><small>회의실</small></button><button class="nav"><span>☷</span><small>작업 기록</small></button><button class="nav"><span>•••</span><small>더보기</small></button></nav></
